<!-- Ab hier: genau die drei Zeilen, die Login3dProvider.php sonst serverseitig in den Login-Kopf der
     OGameX-Installation injiziert (siehe mods/login3d/src/Login3dProvider.php), nur mit Pfaden, die
     zu dieser statischen Demoseite passen. -->
<script src="./mods/_gemeinsam/himmel/vorab.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./mods/_vendor/three-0.186.1/build/three.webgpu.js",
  "three/webgpu": "./mods/_vendor/three-0.186.1/build/three.webgpu.js",
  "three/tsl": "./mods/_vendor/three-0.186.1/build/three.tsl.js"
} }
</script>
<link rel="stylesheet" href="./mods/login3d/css/login3d.css">

<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#02050b;color:#dce6f5;font-family:system-ui,sans-serif}
  #sofort{position:fixed;inset:0;z-index:1;background:#000}
  #sofort video{width:100%;height:100%;object-fit:cover;display:block}
  #sofort.weg{opacity:0;pointer-events:none;transition:opacity .8s ease}
  #hinweis{position:fixed;z-index:3;inset:auto 0 0 0;padding:12px 16px;font-size:12px;line-height:1.5;
    background:linear-gradient(transparent,rgba(5,7,13,.85) 60%);text-align:center;pointer-events:none}
  #hinweis a{color:#8fd1ff;pointer-events:auto}
</style>
</head>
<body>
  <!-- Sofort sichtbar (vorgerenderter Clip), bis die echte Szene unten durchgeladen hat -->
  <div id="sofort"><video src="todesstern.mp4" poster="poster.jpg" autoplay muted loop playsinline></video></div>
  <div id="hinweis">World of Celestia — 3D-Login-Mod für OGame · Quelle:
    <a href="https://github.com/loveascent/OgameX_3D_Mod">OgameX_3D_Mod</a></div>

  <!-- Die echte Szene: Todesstern + prozeduraler Planet, live WebGPU. Baut sich selbst auf (siehe boot.js) -->
  <script type="module" src="./mods/login3d/boot.js"></script>
  <script>
    // Sobald die WebGPU-Ebenen angeschaltet sind (boot.js setzt die Klasse "an"), den Platzhalter wegblenden.
    const weg = () => document.getElementById('sofort')?.classList.add('weg');
    new MutationObserver((ms, obs) => {
      if (document.querySelector('.login3d-todesstern.an')) { weg(); obs.disconnect(); }
    }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
    // Fallback: falls WebGPU fehlt oder etwas hakt, bleibt wenigstens der Clip sichtbar (kein leeres Schwarz)
  </script>
</body>
</html>
