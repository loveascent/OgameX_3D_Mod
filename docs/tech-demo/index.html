// ---------- Cubemap-Abbildung (WebGPU-Konvention: +X −X +Y −Y +Z −Z) ----------

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;
  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }

    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }

// Ablauf pro Schritt: advect -> curl -> zonalClear/zonalSum -> forces -> divergence -> jacobi×K -> project.

// Zelle mit ihren vier Gitternachbarn und einer lokalen Orthonormalbasis.
struct Cell {
  p: vec3f,
  pE: vec3f, pW: vec3f, pN: vec3f, pS: vec3f,
  e1: vec3f, e2: vec3f,
  inv: mat2x2f,     // bildet (fE−fW, fN−fS) auf den Gradienten (in e1/e2) ab
  ax: f32, ay: f32, // 1/Abstand² für den Laplace-Operator
  size: f32,        // mittlere Zellgröße (rad)
};

fn cell(id: vec3u) -> Cell {
  let n = S.velN;
  let st = (vec2f(id.xy) + 0.5) / n;
  let d = 1.0 / n;
  var c: Cell;
  c.p = faceDir(id.z, st);
  c.pE = faceDir(id.z, st + vec2f(d, 0.0));
  c.pW = faceDir(id.z, st - vec2f(d, 0.0));
  c.pN = faceDir(id.z, st + vec2f(0.0, d));
  c.pS = faceDir(id.z, st - vec2f(0.0, d));
  let dA = c.pE - c.pW;
  let dB = c.pN - c.pS;
  c.e1 = normalize(tangent(c.p, dA));
  c.e2 = cross(c.p, c.e1);
  // Zeilen: dA und dB in der lokalen Basis. Gradient g erfüllt M·g = (fE−fW, fN−fS).
  let a = dot(dA, c.e1); let b = dot(dA, c.e2);
  let cc = dot(dB, c.e1); let dd = dot(dB, c.e2);
  let det = a * dd - b * cc;
  // Inverse von [[a, b], [cc, dd]] (WGSL-Matrizen sind spaltenweise).
  c.inv = mat2x2f(vec2f(dd, -cc), vec2f(-b, a)) * (1.0 / det);
  let hx = length(dA) * 0.5;
  let hy = length(dB) * 0.5;
  c.ax = 1.0 / (hx * hx);
  c.ay = 1.0 / (hy * hy);
  c.size = 0.5 * (hx + hy);
  return c;
}

fn grad2(c: Cell, dfA: f32, dfB: f32) -> vec2f { return c.inv * vec2f(dfA, dfB); }

fn vs(@builtin(vertex_index) i: u32) -> VOut {

fn toBody(v: vec3f) -> vec3f { return vec3f(dot(U.body0.xyz, v), dot(U.body1.xyz, v), dot(U.body2.xyz, v)); }

fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(123.34, 456.21));
  q += dot(q, q + 45.32);
  return fract(q.x * q.y);

fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  return mat2x3f(e1, cross(p, e1));
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);

fn hitPlanet(o: vec3f, d: vec3f) -> f32 {
  let c = 1.0 - U.p0.x;
  let s = vec3f(1.0, 1.0 / c, 1.0);
  let os = o * s; let ds = d * s;
  let a = dot(ds, ds);
  let b = dot(os, ds);
  let k = dot(os, os) - 1.0;
  let disc = b * b - a * k;
  if (disc < 0.0) { return -1.0; }
  let t = (-b - sqrt(disc)) / a;
  return select(-1.0, t, t > 0.0);
}

fn aces(x: vec3f) -> vec3f {
  let a = 2.51; let b = 0.03; let c = 2.43; let d = 0.59; let e = 0.14;

    farbe += vec3f(1.0, 0.95, 0.85) * 400.0 * smoothstep(0.9998, 0.99995, dot(rd, Z.sonne.xyz));
  }

  // Gasplanet
  let tp = select(vec2f(-1.0), kugel(ro, rd, Z.planet.xyz, Z.planet.w), !kopflos);
  if (kopflos) {
    // nichts: die Welt zeichnet ihre eigenen Körper
  } else if (tp.x > 0.0) {
    t = tp.x;
    let x = ro + t * rd;
    let n = normalize(x - Z.planet.xyz);
    // ins Planetensystem drehen (Achse y, Winkel achse.w)
    let ca = cos(Z.achse.w); let sa = sin(Z.achse.w);
    let nl = vec3f(ca * n.x - sa * n.z, n.y, sa * n.x + ca * n.z);
    let alb = gasplanet_albedo(nl, C.aufl.z);
    let mu = max(dot(n, -rd), 0.0);
    let ndl = dot(n, Z.sonne.xyz);
    // Lambert mit Randverdunklung (Minnaert, k = 0.75) und weichem Terminator
    let diff = pow(max(ndl, 0.0), 0.75) * pow(max(mu, 0.05), -0.25) * smoothstep(-0.05, 0.15, ndl);
    farbe = alb * Z.sonne.w * diff * 0.9 + alb * 0.004;
    farbe += alb * treffer_licht(x, n);
    // Randleuchten der Atmosphäre: ~ 1/μ (Weglänge) auf der Tagseite
    farbe += Z.atmo.rgb * Z.atmo.w * pow(1.0 - mu, 3.0) * smoothstep(-0.2, 0.3, ndl);
  } else {
    // Atmosphärensaum neben der Scheibe
    let oc = ro - Z.planet.xyz;
    let b = dot(oc, rd);
    let dmin = sqrt(max(dot(oc, oc) - b * b, 0.0));
    if (b < 0.0) {
      let h = (dmin - Z.planet.w) / (0.04 * Z.planet.w);
      let xs = ro - b * rd;
      let ndl = dot(normalize(xs - Z.planet.xyz), Z.sonne.xyz);
      farbe += Z.atmo.rgb * Z.atmo.w * exp(-max(h, 0.0) * 1.5) * smoothstep(-0.3, 0.3, ndl);
    }
  }

  // Todesstern
  let tt = kugel(ro, rd, Z.ts.mitte.xyz, Z.ts.mitte.w * 1.01);
  if (tt.y > 0.0 && tt.x < t) {
    var s = max(tt.x, 0.0);
    for (var k = 0; k < 96; k++) {
      let d = todesstern_sdf(Z.ts, ro + s * rd);
      if (d < 1e-4 * Z.ts.mitte.w) {
        if (s < t) {
          t = s;
          deckung = 1.0;
          let x = ro + s * rd;
          let e = 2e-4 * Z.ts.mitte.w;
          let n = normalize(vec3f(
            todesstern_sdf(Z.ts, x + vec3f(e, 0.0, 0.0)) - todesstern_sdf(Z.ts, x - vec3f(e, 0.0, 0.0)),
            todesstern_sdf(Z.ts, x + vec3f(0.0, e, 0.0)) - todesstern_sdf(Z.ts, x - vec3f(0.0, e, 0.0)),
            todesstern_sdf(Z.ts, x + vec3f(0.0, 0.0, e)) - todesstern_sdf(Z.ts, x - vec3f(0.0, 0.0, e))));
          let pl = ts_lokal(Z.ts, x);
          let alb = vec3f(0.42, 0.43, 0.45) * ts_paneel(pl);
          let ndl = max(dot(n, Z.sonne.xyz), 0.0);
          // Planetenlicht als schwaches Fülllicht (Albedo des Gasplaneten)
          let zuP = normalize(Z.planet.xyz - x);
          farbe = alb * (Z.sonne.w * ndl + 0.02 * max(dot(n, zuP), 0.0) + 0.006);
          // Lichter der Stadtflächen auf der Nachtseite
          let g = floor(pl * 160.0);
          let fl = fract(sin(dot(g, vec3f(12.9898, 78.233, 37.719))) * 43758.5453);
          farbe += vec3f(1.0, 0.85, 0.6) * 0.04 * step(0.985, fl) * smoothstep(0.1, -0.2, dot(n, Z.sonne.xyz));
        }
        break;
      }
      s += d;
      if (s > tt.y || s > t) { break; }
    }
  }

  // Fester Körper (Mond)
  let tm = koerper_verfolgen(K, feld, lin, ro, rd, t);
  if (tm >= 0.0) {
    t = tm;
    deckung = 1.0;
    let x = ro + t * rd;
    farbe = koerper_farbe(K, feld, lin, planck, x, rd, Z.sonne, Z.gluehen.x, select(vec3f(1.0), Z.atmo.rgb, kopflos));
    farbe += vec3f(0.4, 0.38, 0.35) * treffer_licht(x, koerper_normale(K, feld, lin, x));
  }

  var o: Aus;
  o.farbe = vec4f(farbe, select(1.0, deckung, kopflos));
  o.tiefe = vec4f(t, 0.0, 0.0, 0.0);
  return o;
}
`,"zeigen.wgsl":`// Bild: HDR → Bildschirm. Strahl als analytisches Linienintegral eines Gaußprofils (Kern + Halo), verdeckt
// durch die Szenentiefe; danach ACES-Näherung (Narkowicz 2015) und sRGB-Ausgabe.
#include "../kern/kamera.wgsl"
#include "../physik/strahl/strahl_feld.wgsl"

@group(0) @binding(0) var<uniform> C: Kamera;
@group(0) @binding(1) var hdr: texture_2d<f32>;
@group(0) @binding(2) var tiefe: texture_2d<f32>;
@group(0) @binding(3) var<uniform> S: Strahl;
@group(0) @binding(4) var<storage, read> Tr: Treffer;
@group(0) @binding(5) var vol: texture_2d<f32>;    // (L, T) des Volumens, evtl. kleinere Auflösung
@group(0) @binding(6) var volz: texture_2d<f32>;   // Szenentiefe, mit der das Volumen gerechnet wurde

// kleinster Abstand Sichtstrahl ↔ Strecke a→b: (Abstand, t auf Sichtstrahl, s ∈ [0,1] auf Strecke)
fn strecke(ro: vec3f, rd: vec3f, a: vec3f, b: vec3f) -> vec3f {
  let u = b - a; let w = a - ro;
  let uu = dot(u, u); let ud = dot(u, rd); let uw = dot(u, w); let dw = dot(rd, w);
  let den = max(uu - ud * ud, 1e-9);
  let s = clamp((ud * dw - uw) / den, 0.0, 1.0);
  let t = max(dot(a + s * u - ro, rd), 0.0);
  return vec3f(length(ro + t * rd - (a + s * u)), t, s);
}

fn aces(x: vec3f) -> vec3f {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
}

fn komponiere(i: VollbildAus) -> vec4f {
  let p = vec2i(i.pos.xy);
  var a0 = textureLoad(hdr, p, 0).a;
  var c = textureLoad(hdr, p, 0).rgb;
  let z = textureLoad(tiefe, p, 0).r;
  // Volumen: kantenerhaltend (tiefengewichtet bilinear) auf Bildauflösung hochrechnen
  {
    let vs = vec2f(textureDimensions(vol));
    let fs = vec2f(textureDimensions(hdr));
    let q = (vec2f(p) + 0.5) / fs * vs - 0.5;
    let q0 = vec2i(floor(q));
    let f = q - floor(q);
    var lt = vec4f(0.0);
    var ws = 0.0;
    for (var k = 0; k < 4; k++) {
      let o = vec2i(k & 1, k >> 1);
      let c2 = clamp(q0 + o, vec2i(0), vec2i(vs) - 1);
      let bw = select(1.0 - f.x, f.x, o.x == 1) * select(1.0 - f.y, f.y, o.y == 1);
      let zi = textureLoad(volz, c2, 0).r;
      let w = bw / (0.02 + abs(z - zi) / (0.03 * min(z, zi) + 0.02));
      lt += w * textureLoad(vol, c2, 0);
      ws += w;
    }
    lt /= max(ws, 1e-6);
    c = c * lt.a + lt.rgb;
    a0 = 1.0 - (1.0 - a0) * lt.a;   // Deckung: Szene oder Volumen
  }
  if (S.quelle.w > 0.5) {
    let ro = C.pos.xyz;
    let rd = blick(C, i.uv);
    let e = strecke(ro, rd, S.quelle.xyz, Tr.pos.xyz);
    if (e.y < z) {
      let w = strahl_radius(S, e.z * Tr.pos.w);
      let puls = 0.85 + 0.15 * sin(e.z * Tr.pos.w * 40.0 - S.form.w * 60.0);
      let kern = exp(-e.x * e.x / (w * w * 0.25));
      let halo = exp(-e.x / (w * 2.5)) * 0.06;
      let dazu = S.farbe.rgb * S.farbe.w * puls * halo + vec3f(1.0) * S.farbe.w * kern * 1.5;
      c += dazu;
      a0 = max(a0, clamp(max(dazu.r, max(dazu.g, dazu.b)), 0.0, 1.0));
    }
  }
  return vec4f(pow(aces(c * C.aufl.w), vec3f(1.0 / 2.2)), a0);
}

@fragment fn zeigen(i: VollbildAus) -> @location(0) vec4f {
  return vec4f(komponiere(i).rgb, 1.0);
}

// Eingebettet in die Welt: premultipliziertes RGBA (Deckung aus Szene, Volumen und Strahl) und Abstand entlang des Sichtstrahls
struct KopfAus { @location(0) farbe: vec4f, @location(1) tiefe: vec4f };
@fragment fn zeigen_kopflos(i: VollbildAus) -> KopfAus {
  let k = komponiere(i);
  var o: KopfAus;
  // Die Farbe enthält schon Szene und Streulicht (Glut leuchtet additiv); die Deckung sagt, wie viel von der Welt dahinter verschwindet:
  // Ergebnis = Welt · (1 − a) + Farbe
  o.farbe = vec4f(k.rgb, k.a);
  o.tiefe = vec4f(textureLoad(tiefe, vec2i(i.pos.xy), 0).r, 0.0, 0.0, 0.0);
  return o;
}
`,"kamera.wgsl":`// Kern: Kamera-Daten für alle Bild-Shader.
struct Kamera {
  pos: vec4f,     // xyz, w = tan(fov/2)
  vor: vec4f,
  rechts: vec4f,
  oben: vec4f,
  aufl: vec4f,    // Breite, Höhe, Zeit [s], Belichtung
};

// Bildschirm-uv (0..1, y nach unten) → Blickrichtung
fn blick(K: Kamera, uv: vec2f) -> vec3f {
  let a = K.aufl.x / K.aufl.y;
  let p = vec2f((uv.x * 2.0 - 1.0) * a, 1.0 - uv.y * 2.0) * K.pos.w;
  return normalize(K.vor.xyz + p.x * K.rechts.xyz + p.y * K.oben.xyz);
}

// Weltpunkt → Bildschirm-uv und Tiefe entlang der Blickachse
fn projizieren(K: Kamera, x: vec3f) -> vec3f {
  let d = x - K.pos.xyz;
  let z = dot(d, K.vor.xyz);
  let a = K.aufl.x / K.aufl.y;
  let px = dot(d, K.rechts.xyz) / (z * K.pos.w * a);
  let py = dot(d, K.oben.xyz) / (z * K.pos.w);
  return vec3f(px * 0.5 + 0.5, 0.5 - py * 0.5, z);
}

struct VollbildAus { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vollbild(@builtin(vertex_index) i: u32) -> VollbildAus {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VollbildAus;
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
`,"raum.wgsl":`// Kern: ein Simulationsvolumen als orientierter Quader in der Welt (wie ein Niagara-Gitter am Emitter).
// Zelle = Gitterkoordinate in Zelleinheiten (Zellmitte i + 0.5), Welt = Szenenkoordinaten.
struct Volumen {
  mitte: vec4f,  // xyz Weltmitte, w = h (Welt je Zelle)
  ax: vec4f,     // Achse x (Einheitsvektor), w = halbe Kantenlänge
  ay: vec4f,
  az: vec4f,
  n: vec4u,      // Zellen je Achse
};

fn welt_zu_zelle(V: Volumen, x: vec3f) -> vec3f {
  let d = x - V.mitte.xyz;
  let l = vec3f(dot(d, V.ax.xyz), dot(d, V.ay.xyz), dot(d, V.az.xyz));
  return l / V.mitte.w + 0.5 * vec3f(V.n.xyz);
}
fn zelle_zu_welt(V: Volumen, p: vec3f) -> vec3f {
  let l = (p - 0.5 * vec3f(V.n.xyz)) * V.mitte.w;
  return V.mitte.xyz + l.x * V.ax.xyz + l.y * V.ay.xyz + l.z * V.az.xyz;
}
// Weltrichtung → Zellrichtung (ohne Skalierung) und zurück
fn richtung_zu_zelle(V: Volumen, d: vec3f) -> vec3f { return vec3f(dot(d, V.ax.xyz), dot(d, V.ay.xyz), dot(d, V.az.xyz)); }
fn richtung_zu_welt(V: Volumen, d: vec3f) -> vec3f { return d.x * V.ax.xyz + d.y * V.ay.xyz + d.z * V.az.xyz; }

// Strahl gegen Quader: (t_ein, t_aus) in Weltlänge, t_ein > t_aus = verfehlt
fn quader_schnitt(V: Volumen, ro: vec3f, rd: vec3f) -> vec2f {
  let o = richtung_zu_zelle(V, ro - V.mitte.xyz);
  let d = richtung_zu_zelle(V, rd);
  let halb = vec3f(V.ax.w, V.ay.w, V.az.w);
  let inv = 1.0 / select(d, vec3f(1e-9), abs(d) < vec3f(1e-9));
  let t0 = (-halb - o) * inv;
  let t1 = (halb - o) * inv;
  let tn = min(t0, t1);
  let tf = max(t0, t1);
  return vec2f(max(max(tn.x, tn.y), tn.z), min(min(tf.x, tf.y), tf.z));
}
`,"planck_lesen.wgsl":`// Licht: Schwarzkörper-Tabelle lesen (siehe schwarzkoerper.wgsl). Rückgabe: lineares sRGB in cd/m².
fn planck_rgb(tab: texture_1d<f32>, T: f32) -> vec3f {
  let n = f32(textureDimensions(tab));
  let x = clamp(T / 16000.0, 0.0, 1.0) * (n - 1.0);
  let i = u32(floor(x));
  let a = textureLoad(tab, i, 0).rgb;
  let b = textureLoad(tab, min(i + 1u, u32(n) - 1u), 0).rgb;
  return mix(a, b, fract(x));
}
`,"schwarzkoerper.wgsl":`// Licht: Schwarzkörperstrahlung → lineares sRGB in absoluter Leuchtdichte (cd/m²).
// Planck: B(λ,T) = 2hc² / λ⁵ · 1 / (exp(hc/(λkT)) − 1)
// Augenempfindlichkeit: CIE-1931-Normspektralwerte als Mehrkeulen-Gaußfit nach
//   Wyman, Sloan, Shirley (2013), „Simple Analytic Approximations to the CIE XYZ Color Matching Functions“, JCGT 2(2).
// XYZ = 683 lm/W · ∫ B(λ,T) · (x̄, ȳ, z̄) dλ,  dann XYZ → lineares sRGB (IEC 61966-2-1, D65).
// Ergebnis: Draper-Punkt (~800 K erstes Rotglühen), Gelb bei ~2500 K, Weiß bei ~6500 K – ohne handgemachte Farbrampe.
// Die Tabelle (T = 0 … T_MAX) wird einmal berechnet; planck_rgb() liest linear interpoliert.

const T_MAX: f32 = 16000.0;

#include "spektral.wgsl"

// Spektrale Strahldichte [W / (m² · sr · m)]
fn planck(l_m: f32, T: f32) -> f32 {
  let c1 = 1.191042972e-16;  // 2hc²
  let c2 = 1.438776877e-2;   // hc/k [m·K]
  let l5 = l_m * l_m * l_m * l_m * l_m;
  return c1 / (l5 * (exp(min(c2 / (l_m * T), 80.0)) - 1.0));
}

@group(0) @binding(0) var tabelle_aus: texture_storage_1d<rgba32float, write>;

@compute @workgroup_size(64)
fn tabelle(@builtin(global_invocation_id) id: vec3u) {
  let n = textureDimensions(tabelle_aus);
  if (id.x >= n) { return; }
  let T = max(T_MAX * f32(id.x) / f32(n - 1u), 1.0);
  var xyz = vec3f(0.0);
  let schritt = 5.0;
  for (var l = 360.0; l <= 830.0; l += schritt) {
    xyz += planck(l * 1e-9, T) * cie_xyz(l);
  }
  xyz *= 683.0 * schritt * 1e-9;
  // Gamut-Rand: negative Anteile (gesättigtes Rot unter ~1500 K) auf 0, Leuchtdichte Y bleibt im Alpha
  textureStore(tabelle_aus, id.x, vec4f(max(xyz_zu_srgb(xyz), vec3f(0.0)), xyz.y));
}
`,"spektral.wgsl":`// Licht: Spektrum → Farbe. CIE-1931-Normspektralwerte als Mehrkeulen-Gaußfit nach
//   Wyman, Sloan, Shirley (2013), „Simple Analytic Approximations to the CIE XYZ Color Matching Functions“, JCGT 2(2).
// XYZ → lineares sRGB (IEC 61966-2-1, D65).

fn keule(l: f32, mu: f32, s1: f32, s2: f32) -> f32 {
  let s = select(s2, s1, l < mu);
  let t = (l - mu) / s;
  return exp(-0.5 * t * t);
}

fn cie_xyz(l: f32) -> vec3f {  // l in nm
  let x = 1.056 * keule(l, 599.8, 37.9, 31.0) + 0.362 * keule(l, 442.0, 16.0, 26.7) - 0.065 * keule(l, 501.1, 20.4, 26.2);
  let y = 0.821 * keule(l, 568.8, 46.9, 40.5) + 0.286 * keule(l, 530.9, 16.3, 31.1);
  let z = 1.217 * keule(l, 437.0, 11.8, 36.0) + 0.681 * keule(l, 459.0, 26.0, 13.8);
  return vec3f(x, y, z);
}

fn xyz_zu_srgb(c: vec3f) -> vec3f {
  return vec3f( 3.2406 * c.x - 1.5372 * c.y - 0.4986 * c.z,
               -0.9689 * c.x + 1.8758 * c.y + 0.0415 * c.z,
                0.0557 * c.x - 0.2040 * c.y + 1.0570 * c.z);
}

// Farbe einer Spektrallinie λ (monochromatischer Laser). Spektralfarben liegen außerhalb des sRGB-Gamuts:
// negative Anteile abschneiden (gesättigt bleiben), dann auf die Leuchtdichte ȳ(λ) zurückskalieren
// (Rec. 709-Gewichte), damit V(λ) – die Augenempfindlichkeit – erhalten bleibt.
fn linie_rgb(l: f32) -> vec3f {
  let xyz = cie_xyz(l);
  let rgb = max(xyz_zu_srgb(xyz), vec3f(0.0));
  let Y = dot(rgb, vec3f(0.2126, 0.7152, 0.0722));
  return rgb * xyz.y / max(Y, 1e-6);
}
`,"volumen.wgsl":`// Licht: Gasvolumen zeichnen (Feuer + Rauch) – Strahlverfolgung durch das Gitter über das Szenenbild.
// Pro Schritt ds:  T *= e^(−σ_t ds);  L += T · Quelle · (1 − e^(−σ_t ds)) / σ_t
// Quelle = σ_s/σ_t · [Sonne · T_L · Mehrfachstreuung + Treffpunkt-Licht + Umgebung] + Emission/σ_t
// Mehrfachstreuung: Oktaven nach Wrenninge, Kulla, Lundqvist (2013), „Oz: The Great and Volumetric“:
//   Σ_i aⁱ · p(cosθ, cⁱg) · T_L^(bⁱ),  a = b = c = 0.5
// Emission (Kirchhoff): σ_a · B(T) für Ruß/Staub/Kondensat, plus Dampf-Glühen σ_D · Dampf · B(T).
#include "../kern/kamera.wgsl"
#include "../kern/raum.wgsl"
#include "volumen_bild_gemeinsam.wgsl"
#include "planck_lesen.wgsl"
#include "../physik/strahl/strahl_feld.wgsl"

@group(0) @binding(0) var<uniform> C: Kamera;
@group(0) @binding(1) var<uniform> V: Volumen;
@group(0) @binding(2) var<uniform> B: VolumenBild;
@group(0) @binding(3) var skal: texture_3d<f32>;
@group(0) @binding(4) var licht: texture_3d<f32>;
@group(0) @binding(5) var lin: sampler;
@group(0) @binding(7) var tiefe: texture_2d<f32>;
@group(0) @binding(8) var planck: texture_1d<f32>;
@group(0) @binding(9) var<uniform> S: Strahl;
@group(0) @binding(10) var<storage, read> Tr: Treffer;

fn hash2(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(12.9898, 78.233))) * 43758.5453); }

// Ausgabe: (L, T) = Streulicht + Durchlässigkeit des Volumens, und die Szenentiefe, mit der gerechnet wurde (für das kantenerhaltende
// Hochrechnen in bild/zeigen.wgsl). Das Volumen darf in kleinerer Auflösung als die Szene gerechnet werden.
struct VolAus { @location(0) lt: vec4f, @location(1) z: vec4f };

@fragment fn volumen(i: VollbildAus) -> VolAus {
  // Szenenpixel in der Mitte dieses (größeren) Volumenpixels; von den vier Szenenpixeln darunter die nächste Tiefe nehmen
  let fs = vec2i(textureDimensions(tiefe));
  let px = clamp(vec2i(i.uv * vec2f(fs)), vec2i(0), fs - 1);
  var z = textureLoad(tiefe, px, 0).r;
  z = min(z, textureLoad(tiefe, clamp(px + vec2i(1, 0), vec2i(0), fs - 1), 0).r);
  z = min(z, textureLoad(tiefe, clamp(px + vec2i(0, 1), vec2i(0), fs - 1), 0).r);
  z = min(z, textureLoad(tiefe, clamp(px + vec2i(1, 1), vec2i(0), fs - 1), 0).r);
  var o: VolAus;
  o.z = vec4f(z, 0.0, 0.0, 0.0);
  let ro = C.pos.xyz;
  let rd = blick(C, i.uv);
  let ab = quader_schnitt(V, ro, rd);
  let t0 = max(ab.x, 0.0);
  let t1 = min(ab.y, z);
  if (t1 <= t0) { o.lt = vec4f(0.0, 0.0, 0.0, 1.0); return o; }

  let n = vec3f(V.n.xyz);
  let ds = 0.8 * V.mitte.w;
  let schritte = min(i32((t1 - t0) / ds) + 1, 400);
  var t = t0 + ds * hash2(i.pos.xy + fract(C.aufl.z) * 100.0);
  var Tr_ = 1.0;
  var L = vec3f(0.0);
  let cth = dot(rd, B.sonne.xyz);
  var ms = 0.0;
  for (var o = 0; o < 3; o++) {
    let f = pow(0.5, f32(o));
    ms += f * phase_hg(cth, B.emis.w * f);
  }
  let trefferAn = Tr.normale.w > 0.5 && S.quelle.w > 0.5;

  for (var k = 0; k < schritte; k++) {
    if (t > t1 || Tr_ < 0.003) { break; }
    let x = ro + t * rd;
    let u = welt_zu_zelle(V, x) / n;
    let s = textureSampleLevel(skal, lin, u, 0.0);
    let m = rand_maske(B, u, n);
    let sk = B.kond.w * s.r * m;
    let ss = B.staub.w * s.a * m;
    let st = sk + ss;
    let emD = B.emis.x * s.b * m;
    if (st > 1e-4 || emD > 1e-4) {
      let alb = (sk * B.kond.rgb + ss * B.staub.rgb) / max(st, 1e-6);
      let TL = textureSampleLevel(licht, lin, u, 0.0).r;
      var tl = 0.0;
      for (var o = 0; o < 3; o++) { tl += pow(0.5, f32(o)) * pow(TL, pow(0.5, f32(o))); }
      var ein = vec3f(B.sonne.w * ms * tl / 1.75) + vec3f(B.rand.y);
      if (trefferAn) {
        let d = Tr.pos.xyz + Tr.normale.xyz * 0.03 - x;
        ein += S.farbe.rgb * B.rand.w / max(dot(d, d), 4e-3);
        ein += S.farbe.rgb * B.rand.z * strahl_intensitaet(S, Tr, x, 0.01) * 1e-4;
      }
      let BT = planck_rgb(planck, s.g) * B.emis.z;
      let absorb = st * (vec3f(1.0) - alb);
      let quelle = st * alb * ein + absorb * BT + emD * BT;
      let a = exp(-st * ds);
      // analytische Integration über den Schritt (Hillaire 2015, energieerhaltend)
      L += Tr_ * select(quelle * ds, quelle * (1.0 - a) / st, st > 1e-4);
      Tr_ *= a;
    }
    t += ds;
  }
  o.lt = vec4f(L, Tr_);
  return o;
}
`,"volumen_bild_gemeinsam.wgsl":`// Licht: optische Eigenschaften eines Gasvolumens (gemeinsam für Schatten- und Bildrechnung).
// Teilnehmende Medien (Strahlungstransport-Gleichung, Chandrasekhar 1950):
//   dL/ds = −σ_t L + σ_a B(T) + σ_s ∫ p(ω·ω') L_ein dω'
// σ_t = σ_K·Kondensat + σ_S·Staub (Extinktion), σ_s = σ_t · Albedo (Streuung), σ_a = σ_t − σ_s (Absorption).
// Kirchhoff: was absorbiert, strahlt bei T auch aus → heißer Ruß/Staub ist „Feuer“, kalter ist „Rauch“.
struct VolumenBild {
  sonne: vec4f,     // Richtung zur Sonne, Stärke
  kond: vec4f,      // Albedo Kondensat rgb, σ_K [1/Welt je Dichte]
  staub: vec4f,     // Albedo Staub rgb, σ_S
  emis: vec4f,      // σ Dampf-Emission, σ Gas-Emission, Planck-Skala, g (Henyey-Greenstein)
  rand: vec4f,      // Randausblendung [Zellen], Umgebungslicht, Tyndall (Strahl im Rauch), Treffpunkt-Licht
  schatten: vec4f,  // Schattenkugel Mitte, Radius (0 = keine)
};

// Weiches Ausblenden zum Gitterrand (u = normierte Gitterkoordinate, n = Zellen je Achse)
fn rand_maske(B: VolumenBild, u: vec3f, n: vec3f) -> f32 {
  let d = min(u, 1.0 - u) * n;
  let m = clamp(min(min(d.x, d.y), d.z) / max(B.rand.x, 1e-3), 0.0, 1.0);
  // zusätzlich kugelförmig ausblenden: die Würfelkanten des Gitters bleiben so nie als Kasten sichtbar
  let kugel = 1.0 - smoothstep(0.26, 0.5, length(u - vec3f(0.5)));
  return m * m * (3.0 - 2.0 * m) * kugel;
}

fn sigma_t(B: VolumenBild, s: vec4f, u: vec3f, n: vec3f) -> f32 {
  return (B.kond.w * s.r + B.staub.w * s.a) * rand_maske(B, u, n);
}

// Henyey-Greenstein-Phasenfunktion
fn phase_hg(c: f32, g: f32) -> f32 {
  let g2 = g * g;
  return (1.0 - g2) / (12.566371 * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
`,"volumen_licht.wgsl":`// Licht: Durchlässigkeit zur Sonne für jede Zelle eines Gasvolumens (halbe Auflösung).
// T_L(x) = exp(−∫ σ_t ds) entlang x + s·l, plus harte Abschattung durch feste Körper (Abstandsfeld) und
// eine Schattenkugel (Planet). Einmal je Bild gerechnet, dann beim Darstellen nur noch nachgeschlagen.
#include "../physik/koerper/koerper_feld.wgsl"
#include "volumen_bild_gemeinsam.wgsl"

@group(0) @binding(0) var<uniform> V: Volumen;
@group(0) @binding(1) var<uniform> B: VolumenBild;
@group(0) @binding(2) var skal: texture_3d<f32>;
@group(0) @binding(3) var lin: sampler;
@group(0) @binding(4) var<uniform> K: Koerper;
@group(0) @binding(5) var feld: texture_3d<f32>;
@group(0) @binding(6) var licht_aus: texture_storage_3d<rgba16float, write>;

@compute @workgroup_size(4, 4, 4)
fn licht(@builtin(global_invocation_id) id: vec3u) {
  let nl = textureDimensions(licht_aus);
  if (any(id >= nl)) { return; }
  let n = vec3f(V.n.xyz);
  let zelle = (vec3f(id) + 0.5) / vec3f(nl) * n;
  let x = zelle_zu_welt(V, zelle);
  let l = B.sonne.xyz;
  let ab = quader_schnitt(V, x, l);
  let ds = 1.5 * V.mitte.w;
  var tau = 0.0;
  var t = 0.5 * ds;
  for (var k = 0; k < 256; k++) {
    if (t > ab.y) { break; }
    let p = x + t * l;
    let u = welt_zu_zelle(V, p) / n;
    tau += sigma_t(B, textureSampleLevel(skal, lin, u, 0.0), u, n) * ds;
    t += ds;
  }
  var T = exp(-tau);
  // fester Körper im Weg (kurze Kugelverfolgung)
  if (koerper_verfolgen(K, feld, lin, x + l * V.mitte.w, l, 4.0 * V.ax.w) >= 0.0) { T = 0.0; }
  // Planet als Schattenkugel
  let oc = x - B.schatten.xyz;
  let b = dot(oc, l);
  let disk = b * b - (dot(oc, oc) - B.schatten.w * B.schatten.w);
  if (disk > 0.0 && -b + sqrt(disk) > 0.0 && B.schatten.w > 0.0) { T = 0.0; }
  textureStore(licht_aus, vec3i(id), vec4f(T, 0.0, 0.0, 0.0));
}
`,"gasplanet.wgsl":`// Objekt: Gasplanet-Aussehen (Beispiel-Ziel). Zonale Bänder u(φ) wie bei Jupiter, mit verwirbeltem Rauschen
// (Domain Warping nach Quilez) gegen die Bandkanten. Für das Original-Aussehen kann später die Fluid-Gas-Planet-
// Textur eingesetzt werden; die Effekte hängen nicht davon ab.

fn gp_hash(p: vec3f) -> f32 { return fract(sin(dot(p, vec3f(127.1, 311.7, 74.7))) * 43758.5453); }
fn gp_rausch(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  var s = 0.0;
  for (var k = 0; k < 8; k++) {
    let o = vec3f(f32(k & 1), f32((k >> 1) & 1), f32((k >> 2) & 1));
    let w = mix(1.0 - u, u, o);
    s += gp_hash(i + o) * w.x * w.y * w.z;
  }
  return s;
}
fn gp_fbm(p: vec3f) -> f32 {
  var s = 0.0; var a = 0.5; var q = p;
  for (var i = 0; i < 5; i++) { s += a * gp_rausch(q); q = q * 2.03 + 7.1; a *= 0.5; }
  return s;
}

// n: Oberflächennormale im Planetensystem (y = Drehachse), t: Zeit
fn gasplanet_albedo(n: vec3f, t: f32) -> vec3f {
  let w1 = vec3f(gp_fbm(n * 3.0 + vec3f(0.0, 0.0, t * 0.01)), gp_fbm(n * 3.0 + 5.2), gp_fbm(n * 3.0 + 9.7));
  let q = n + 0.12 * (w1 - 0.5);
  let breite = q.y * 9.0 + 0.6 * gp_fbm(q * 6.0);
  let band = 0.5 + 0.5 * sin(breite * 3.14159);
  let hell = vec3f(0.93, 0.86, 0.74);
  let dunkel = vec3f(0.66, 0.45, 0.30);
  var c = mix(dunkel, hell, smoothstep(0.25, 0.75, band));
  c *= 0.85 + 0.3 * gp_fbm(q * 18.0);
  return c;
}
`,"mond.wgsl":`// Objekt: Gesteinsmond als Abstandsfeld. Kugel + Einschlagkrater (Profil nach Melosh, „Impact Cratering“,
// einfache Krater: Schüssel mit Tiefe ≈ 0.2 D und Randwall, der nach außen ~ (r/R)⁻³ abfällt) + feines Rauschen.
// Nur Beispiel-Form: jede andere Objektdatei mit fn form_sdf(p, groesse) funktioniert genauso.

fn mond_hash3(i: f32) -> vec3f {
  let p = vec3f(i * 12.9898, i * 78.233, i * 37.719);
  return fract(sin(p) * 43758.5453) * 2.0 - 1.0;
}

fn mond_rausch(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  var s = 0.0;
  for (var k = 0; k < 8; k++) {
    let o = vec3f(f32(k & 1), f32((k >> 1) & 1), f32((k >> 2) & 1));
    let q = i + o;
    let h = fract(sin(dot(q, vec3f(127.1, 311.7, 74.7))) * 43758.5453);
    let w = mix(1.0 - u, u, o);
    s += h * w.x * w.y * w.z;
  }
  return s;
}

fn form_sdf(p: vec3f, R: f32) -> f32 {
  let r = length(p);
  let n = p / max(r, 1e-6);
  var hoehe = 0.0;
  for (var i = 0; i < 28; i++) {
    let m = normalize(mond_hash3(f32(i) + 1.0) + vec3f(1e-4));
    let groesse = R * mix(0.08, 0.32, pow(fract(f32(i) * 0.618034), 2.2));
    let d = acos(clamp(dot(n, m), -1.0, 1.0)) * R / groesse;   // Abstand in Kraterradien
    // innen: Schüssel −0.22(1 − d²) mit zum Rand ansteigendem Wall 0.06 d⁴; außen: Auswurfdecke 0.06 d⁻³ (stetig bei d = 1)
    let innen = -0.22 * (1.0 - d * d) + 0.06 * d * d * d * d;
    let aussen = 0.06 / (d * d * d);
    hoehe += groesse * select(aussen, innen, d < 1.0);
  }
  hoehe += R * 0.012 * (mond_rausch(p * 6.0 / R) + 0.5 * mond_rausch(p * 13.0 / R) - 0.75);
  return (r - R - hoehe) * 0.85;
}
`,"todesstern.wgsl":`// Objekt: Todesstern als Abstandsfeld (Beispiel einer Strahlquelle). Kugel, Äquatorgraben, konkave Schüssel
// (Kugel minus Kugel), Paneelraster als Flächenhöhe. Lokale Achse z = Blickrichtung der Schüssel.
// Die Schüssel-Geometrie bestimmt den Strahl: 8 Zubringerstrahlen vom Schüsselrand treffen sich im Brennpunkt.

struct Todesstern {
  mitte: vec4f,  // xyz, w = Radius
  ax: vec4f,     // lokale Achsen in Welt
  ay: vec4f,
  az: vec4f,     // Schüssel-Richtung
};

fn ts_lokal(T: Todesstern, x: vec3f) -> vec3f {
  let d = (x - T.mitte.xyz) / T.mitte.w;
  return vec3f(dot(d, T.ax.xyz), dot(d, T.ay.xyz), dot(d, T.az.xyz));
}

// Schüssel: Mittelpunkt auf Achse in Richtung (sin 35°·y + cos 35°·z) gekippt – wie im Film nördlich des Äquators
fn ts_schuessel_achse() -> vec3f { return normalize(vec3f(0.0, 0.57, 0.82)); }

fn ts_sdf_lokal(p: vec3f) -> f32 {
  var d = length(p) - 1.0;
  // Äquatorgraben
  d = max(d, -(abs(p.y) - 0.012));
  // Schüssel
  let a = ts_schuessel_achse();
  let s = length(p - a * 1.18) - 0.42;
  d = max(d, -s);
  return d;
}

fn todesstern_sdf(T: Todesstern, x: vec3f) -> f32 {
  return ts_sdf_lokal(ts_lokal(T, x)) * T.mitte.w;
}

// Paneel-Muster als Helligkeit (für die Darstellung): Breiten-/Längenraster mit zufälliger Tönung
fn ts_paneel(p: vec3f) -> f32 {
  let n = normalize(p);
  let br = asin(clamp(n.y, -1.0, 1.0));
  let la = atan2(n.x, n.z);
  let g = vec2f(la * 40.0, br * 40.0);
  let z = floor(g);
  let f = fract(g);
  let kante = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  let ton = fract(sin(dot(z, vec2f(12.9898, 78.233))) * 43758.5453);
  return mix(0.55, 1.0, ton) * mix(0.6, 1.0, smoothstep(0.0, 0.06, kante));
}
`,"gas_advektion.wgsl":`// Gas-Löser, Schritt 2: Advektion ∂φ/∂t + (u·∇)φ = 0 für Geschwindigkeit und Skalare gemeinsam.
// Verfahren: MacCormack nach Selle, Fedkiw, Kim, Liu, Rossignac (2008), „An Unconditionally Stable
// MacCormack Method“: φ̂ = A(φⁿ), φ̃ = A⁻¹(φ̂), φⁿ⁺¹ = φ̂ + ½(φⁿ − φ̃), begrenzt auf die Werte der
// 8 Nachbarn am Rückverfolgungspunkt (sonst Rückfall auf semi-Lagrange). Rückverfolgung mit RK2.
#include "gas_gemeinsam.wgsl"

@group(0) @binding(0) var<uniform> P: GasP;
@group(0) @binding(1) var lin: sampler;
@group(0) @binding(2) var vel: texture_3d<f32>;       // uⁿ (Transportgeschwindigkeit)
@group(0) @binding(3) var skal_alt: texture_3d<f32>;  // φⁿ Skalare
@group(0) @binding(4) var vel_alt: texture_3d<f32>;   // φⁿ Geschwindigkeit
@group(0) @binding(5) var skal_hut: texture_3d<f32>;  // φ̂ (nur Korrektur)
@group(0) @binding(6) var vel_hut: texture_3d<f32>;
@group(0) @binding(7) var rand: texture_3d<f32>;
@group(0) @binding(8) var skal_aus: texture_storage_3d<rgba16float, write>;
@group(0) @binding(9) var vel_aus: texture_storage_3d<rgba16float, write>;

fn uvw(p: vec3f) -> vec3f { return p / vec3f(P.n.xyz); }
fn u_bei(p: vec3f) -> vec3f { return textureSampleLevel(vel, lin, uvw(p), 0.0).xyz; }

// RK2-Bahn ohne Begrenzung: x(t − dt) bzw. x(t + dt) bei Vorzeichen s
fn bahn_frei(p: vec3f, s: f32) -> vec3f {
  let dt = P.zeit.x * s;
  let mitte = p - 0.5 * dt * u_bei(p);
  return p - dt * u_bei(mitte);
}
fn bahn(p: vec3f, s: f32) -> vec3f { return clamp(bahn_frei(p, s), vec3f(0.5), vec3f(P.n.xyz) - 0.5); }

// Offener Rand: Was von außerhalb hereinströmt, ist ruhende Umgebungsluft (kein Rauch, T = T_a(z)).
// Ohne das liest die Advektion immer wieder die Randzellen ein und Rauch staut sich am Gitterrand zu einem Block.
fn draussen(q: vec3f) -> bool { return any(q < vec3f(0.0)) || any(q > vec3f(P.n.xyz)); }
fn umgebung_bei(q: vec3f) -> vec4f { return vec4f(0.0, T_umgebung(P, oben_bei(P, q).w), 0.0, 0.0); }

@compute @workgroup_size(4, 4, 4)
fn vorwaerts(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let c = vec3i(id);
  let p = vec3f(id) + 0.5;
  let q = bahn_frei(p, 1.0);
  let x = uvw(clamp(q, vec3f(0.5), vec3f(P.n.xyz) - 0.5));
  textureStore(skal_aus, c, sauber4(select(textureSampleLevel(skal_alt, lin, x, 0.0), umgebung_bei(q), draussen(q)), 6e4));
  textureStore(vel_aus, c, sauber4(textureSampleLevel(vel_alt, lin, x, 0.0), 6e4));
}

@compute @workgroup_size(4, 4, 4)
fn korrektur(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let c = vec3i(id);
  if (textureLoad(rand, c, 0).r < 0.0) {
    textureStore(skal_aus, c, textureLoad(skal_alt, c, 0));
    textureStore(vel_aus, c, vec4f(0.0));
    return;
  }
  let p = vec3f(id) + 0.5;
  let sh = textureLoad(skal_hut, c, 0);
  let vh = textureLoad(vel_hut, c, 0);
  // φ̃: φ̂ vorwärts zurück an den Ausgangspunkt getragen
  let xf = uvw(bahn(p, -1.0));
  let st = textureSampleLevel(skal_hut, lin, xf, 0.0);
  let vt = textureSampleLevel(vel_hut, lin, xf, 0.0);
  var s = sh + 0.5 * (textureLoad(skal_alt, c, 0) - st);
  var v = vh + 0.5 * (textureLoad(vel_alt, c, 0) - vt);

  // Begrenzer: Extremwerte der 8 Zellen um den Rückverfolgungspunkt
  let b = bahn(p, 1.0) - 0.5;
  let b0 = vec3i(floor(b));
  var smin = vec4f(1e9); var smax = vec4f(-1e9);
  var vmin = vec4f(1e9); var vmax = vec4f(-1e9);
  for (var k = 0; k < 8; k++) {
    let q = clamp(b0 + vec3i(k & 1, (k >> 1) & 1, (k >> 2) & 1), vec3i(0), vec3i(P.n.xyz) - 1);
    let a = textureLoad(skal_alt, q, 0);
    let w = textureLoad(vel_alt, q, 0);
    smin = min(smin, a); smax = max(smax, a);
    vmin = min(vmin, w); vmax = max(vmax, w);
  }
  s = select(s, sh, (s < smin) | (s > smax));
  v = select(v, vh, (v < vmin) | (v > vmax));
  if (draussen(bahn_frei(p, 1.0))) { s = sh; }   // Zustrom von außen: keine Korrektur, φ̂ ist schon Umgebung
  textureStore(skal_aus, c, sauber4(max(s, vec4f(0.0, 3.0, 0.0, 0.0)), 6e4));
  textureStore(vel_aus, c, vec4f(sauber3(v.xyz, 6e4), 0.0));
}
`,"gas_anfang.wgsl":`// Gas-Löser: Anfangszustand. Ruhende, geschichtete Atmosphäre T_a(z); optional eine Wolkendecke
// zwischen z_unten und z_oben (Kondensat), darüber/darunter Dampf an der Sättigungsgrenze.
#include "gas_gemeinsam.wgsl"

struct Anfang {
  wolke: vec4f,   // z_unten [Zellen], z_oben [Zellen], Dichte, Dampf-Anteil der Sättigung
};
@group(0) @binding(0) var<uniform> P: GasP;
@group(0) @binding(1) var<uniform> A: Anfang;
@group(0) @binding(2) var skal_aus: texture_storage_3d<rgba16float, write>;
@group(0) @binding(3) var vel_aus: texture_storage_3d<rgba16float, write>;

fn hash(p: vec3u) -> f32 {
  var h = (p.x * 73856093u) ^ (p.y * 19349663u) ^ (p.z * 83492791u);
  h = (h ^ (h >> 13u)) * 1274126177u;
  return f32(h & 0xffffu) / 65535.0;
}

@compute @workgroup_size(4, 4, 4)
fn anfang(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let ob = oben_bei(P, vec3f(id) + 0.5);
  let T = T_umgebung(P, ob.w);
  let rand = smoothstep(A.wolke.x - 2.0, A.wolke.x + 2.0, ob.w) * (1.0 - smoothstep(A.wolke.y - 3.0, A.wolke.y + 3.0, ob.w));
  let wolke = A.wolke.z * rand * (0.75 + 0.5 * hash(id));
  let dampf = A.wolke.w * q_saettigung(P, T);
  textureStore(skal_aus, vec3i(id), vec4f(wolke, T, dampf, 0.0));
  textureStore(vel_aus, vec3i(id), vec4f(0.0));
}
`,"gas_gemeinsam.wgsl":`// Gas-Löser: gemeinsame Definitionen.
// Gitter: zellzentriert, Geschwindigkeit in Zellen/s im Gitter-eigenen Achsensystem.
// Skalarfeld skal: r = Kondensat (Rauch/Wolke, sichtbar), g = Temperatur T [K],
//                  b = Dampf (kondensierbar, unsichtbar), a = Staub (inert, sichtbar).
// Quellen: Jemand anderes (Kopplung) schreibt Rate-Texturen; der Löser kennt weder Strahl noch Körper.

struct GasP {
  n: vec4u,          // nx, ny, nz, -
  zeit: vec4f,       // dt [s], h [Welt/Zelle], t [s], -
  schwere: vec4f,    // Schwerezentrum (Zellen), g an r0 [Zellen/s²]
  schwere2: vec4f,   // r0 [Zellen], Modus (0 konstant, 1 radial), -, -
  oben: vec4f,       // Richtung „oben“ für Modus 0
  umgebung: vec4f,   // T0 [K] auf Höhe 0, Γ_umg [K/Zelle], Γ_ad [K/Zelle], α (Staub-/Kondensatgewicht)
  wirbel: vec4f,     // ε Wirbelverstärkung, Newton-Kühlung [1/s], Strahlungskühlung [1/(s·K³)], Wand-Wärmeübergang [1/s]
  zerfall: vec4f,    // Zerfall [1/s]: Kondensat, Staub, Dampf, Schwamm am Rand [1/s]
  phase: vec4f,      // Clausius-Clapeyron: T_ref [K], L/R_v [K], q_ref, τ [s]
  phase2: vec4f,     // Latentwärme [K je Einheit], Expansion (1 = ideales Gas), T_max [K], v_max [Welt/s]
};

fn idx_ok(p: vec3i, n: vec3u) -> bool {
  return all(p >= vec3i(0)) && all(p < vec3i(n));
}

// Höhe über „Grund“ in Zellen und Aufwärtsrichtung an Position p (Zellkoordinaten, Zellmitte = i + 0.5)
fn oben_bei(P: GasP, p: vec3f) -> vec4f {
  if (P.schwere2.y > 0.5) {
    let d = p - P.schwere.xyz;
    let r = max(length(d), 1e-3);
    return vec4f(d / r, r - P.schwere2.x);
  }
  return vec4f(P.oben.xyz, dot(p, P.oben.xyz));
}

// Schwere-Betrag: g(r) = g0 (r0/r)² (radial) bzw. konstant
fn g_bei(P: GasP, hoehe: f32) -> f32 {
  if (P.schwere2.y > 0.5) {
    let r = max(P.schwere2.x + hoehe, 1.0);
    let s = P.schwere2.x / r;
    return P.schwere.w * s * s;
  }
  return P.schwere.w;
}

// Umgebungstemperatur der geschichteten Atmosphäre: T_a(z) = T0 − Γ_umg z (nicht unter 3 K)
fn T_umgebung(P: GasP, hoehe: f32) -> f32 {
  return max(P.umgebung.x - P.umgebung.y * hoehe, 3.0);
}

// Sättigungsdampfmenge nach Clausius-Clapeyron: q_s(T) = q_ref · exp(L/R_v · (1/T_ref − 1/T))
fn q_saettigung(P: GasP, T: f32) -> f32 {
  return P.phase.z * exp(clamp(P.phase.y * (1.0 / P.phase.x - 1.0 / max(T, 1.0)), -60.0, 30.0));
}

// ---- Schutz gegen Überläufe -------------------------------------------------------------------------------------------
// NaN/Inf werden über das Bitmuster erkannt (Vergleiche mit NaN sind in WGSL nicht verlässlich). Jedes Gas-Feld wird vor dem
// Speichern gesäubert: nicht endlich → 0, sonst begrenzt. So kann sich ein einzelner Ausreißer nie über das Gitter ausbreiten.
fn endlich(x: f32) -> bool { return (bitcast<u32>(x) & 0x7f800000u) != 0x7f800000u; }
fn sauber(x: f32, lim: f32) -> f32 { return select(0.0, clamp(x, -lim, lim), endlich(x)); }
fn sauber3(v: vec3f, lim: f32) -> vec3f { return vec3f(sauber(v.x, lim), sauber(v.y, lim), sauber(v.z, lim)); }
fn sauber4(v: vec4f, lim: f32) -> vec4f { return vec4f(sauber(v.x, lim), sauber(v.y, lim), sauber(v.z, lim), sauber(v.w, lim)); }
`,"gas_kraefte.wgsl":`// Gas-Löser, Schritt 3: Volumenkräfte.
// Auftrieb (ideales Gas, veränderliche Dichte): a = g · [ (1 − T_a(z)/T) − α (Kondensat + Staub) ] · oben
//   → heißes Gas steigt, Partikellast zieht nach unten, in stabiler Schichtung (Γ_umg < Γ_ad) breitet
//     sich die Fahne in der Höhe neutralen Auftriebs pilzförmig aus.
// Wirbelverstärkung (Fedkiw, Stam, Jensen 2001, „Visual Simulation of Smoke“):
//   ω = ∇ × u,  N = ∇|ω| / |∇|ω||,  f = ε h (N × ω)  – gibt die am Gitter verlorene Kleinwirbel-Energie zurück.
#include "gas_gemeinsam.wgsl"

@group(0) @binding(0) var<uniform> P: GasP;
@group(0) @binding(1) var vel: texture_3d<f32>;
@group(0) @binding(2) var skal: texture_3d<f32>;
@group(0) @binding(3) var wirbel_ein: texture_3d<f32>;
@group(0) @binding(4) var rand: texture_3d<f32>;
@group(0) @binding(5) var wirbel_aus: texture_storage_3d<rgba16float, write>;
@group(0) @binding(6) var vel_aus: texture_storage_3d<rgba16float, write>;

fn ld(t: texture_3d<f32>, c: vec3i) -> vec4f {
  return textureLoad(t, clamp(c, vec3i(0), vec3i(P.n.xyz) - 1), 0);
}

@compute @workgroup_size(4, 4, 4)
fn rotation(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let c = vec3i(id);
  let xp = ld(vel, c + vec3i(1, 0, 0)).xyz; let xm = ld(vel, c - vec3i(1, 0, 0)).xyz;
  let yp = ld(vel, c + vec3i(0, 1, 0)).xyz; let ym = ld(vel, c - vec3i(0, 1, 0)).xyz;
  let zp = ld(vel, c + vec3i(0, 0, 1)).xyz; let zm = ld(vel, c - vec3i(0, 0, 1)).xyz;
  let w = 0.5 * vec3f((yp.z - ym.z) - (zp.y - zm.y), (zp.x - zm.x) - (xp.z - xm.z), (xp.y - xm.y) - (yp.x - ym.x));
  textureStore(wirbel_aus, c, vec4f(w, length(w)));
}

@compute @workgroup_size(4, 4, 4)
fn kraefte(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let c = vec3i(id);
  let dt = P.zeit.x;
  if (textureLoad(rand, c, 0).r < 0.0) { textureStore(vel_aus, c, vec4f(0.0)); return; }
  var u = textureLoad(vel, c, 0).xyz;
  let s = textureLoad(skal, c, 0);
  let ob = oben_bei(P, vec3f(id) + 0.5);
  let Ta = T_umgebung(P, ob.w);

  // Auftrieb mit veränderlicher Dichte (ideales Gas, ρ ∝ 1/T): a = g (ρ_a − ρ)/ρ_a = g (1 − T_a/T).
  // Für kleine ΔT gleich Boussinesq (T − T_a)/T_a, für Feuergase aber nach oben durch g begrenzt –
  // Boussinesq allein gäbe bei 4500 K in 290 K Luft das 15-Fache von g.
  let b = (s.g - Ta) / max(s.g, 1.0) - P.umgebung.w * (s.r + s.a);
  u += dt * g_bei(P, ob.w) * clamp(b, -4.0, 1.0) * ob.xyz;

  // Wirbelverstärkung
  let om = textureLoad(wirbel_ein, c, 0);
  let gr = 0.5 * vec3f(ld(wirbel_ein, c + vec3i(1, 0, 0)).w - ld(wirbel_ein, c - vec3i(1, 0, 0)).w,
                       ld(wirbel_ein, c + vec3i(0, 1, 0)).w - ld(wirbel_ein, c - vec3i(0, 1, 0)).w,
                       ld(wirbel_ein, c + vec3i(0, 0, 1)).w - ld(wirbel_ein, c - vec3i(0, 0, 1)).w);
  let N = gr / max(length(gr), 1e-5);
  u += dt * P.wirbel.x * cross(N, om.xyz);

  textureStore(vel_aus, c, vec4f(sauber3(u, 6e4), 0.0));
}
`,"gas_projektion.wgsl":`// Gas-Löser, Schritt 4: Druckprojektion (Helmholtz-Hodge), Chorin 1968 / Stam 1999 „Stable Fluids“.
//   ∇²p = ∇·u* − D,   uⁿ⁺¹ = u* − ∇p     (dt und ρ in p eingerechnet)
// D = Ausdehnung des Gases beim Erwärmen. Niedrig-Mach-Näherung, ideales Gas, isobar:
//   ∇·u = (1/T) · DT/Dt   → frisch erhitztes Gas drückt nach außen (der „Puff“ beim Einschlag).
// Festkörper: undurchlässig (Normalanteil = 0, Nachbardruck = eigener Druck), Gitterrand offen (p = 0).
#include "gas_gemeinsam.wgsl"

@group(0) @binding(0) var<uniform> P: GasP;
@group(0) @binding(1) var vel: texture_3d<f32>;
@group(0) @binding(2) var rand: texture_3d<f32>;
@group(0) @binding(3) var skal: texture_3d<f32>;
@group(0) @binding(4) var quell_s: texture_3d<f32>;
@group(0) @binding(5) var druck: texture_3d<f32>;
@group(0) @binding(6) var div_aus: texture_storage_3d<r32float, write>;
@group(0) @binding(7) var vel_aus: texture_storage_3d<rgba16float, write>;

fn fest(c: vec3i) -> bool { return textureLoad(rand, c, 0).r < 0.0; }
fn drin(c: vec3i) -> bool { return all(c >= vec3i(0)) && all(c < vec3i(P.n.xyz)); }

// Nachbargeschwindigkeit: Wand = 0, außerhalb = eigene (offener Rand, kein Gradient)
fn u_nb(c: vec3i, eigen: vec3f) -> vec3f {
  if (!drin(c)) { return eigen; }
  if (fest(c)) { return vec3f(0.0); }
  return textureLoad(vel, c, 0).xyz;
}

@compute @workgroup_size(4, 4, 4)
fn divergenz(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let c = vec3i(id);
  if (fest(c)) { textureStore(div_aus, c, vec4f(0.0)); return; }
  let u = textureLoad(vel, c, 0).xyz;
  let d = 0.5 * (u_nb(c + vec3i(1, 0, 0), u).x - u_nb(c - vec3i(1, 0, 0), u).x
               + u_nb(c + vec3i(0, 1, 0), u).y - u_nb(c - vec3i(0, 1, 0), u).y
               + u_nb(c + vec3i(0, 0, 1), u).z - u_nb(c - vec3i(0, 0, 1), u).z);
  let T = max(textureLoad(skal, c, 0).g, 3.0);
  // Ausdehnung durch Erwärmen: nur die Erwärmung, die bis T_max überhaupt möglich ist (sonst bliebe die Rate bei Heizraten von 1e7 K/s unbegrenzt)
  let rate = min(max(sauber(textureLoad(quell_s, c, 0).g, 1e9), 0.0), max(P.phase2.z - T, 0.0) / P.zeit.x);
  let ausdehnung = P.phase2.y * rate / T;
  textureStore(div_aus, c, vec4f(sauber(d - ausdehnung, 1e5)));
}

fn p_nb(c: vec3i, eigen: f32) -> f32 {
  if (!drin(c)) { return 0.0; }
  if (fest(c)) { return eigen; }
  return textureLoad(druck, c, 0).r;
}

@compute @workgroup_size(4, 4, 4)
fn projektion(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let c = vec3i(id);
  if (fest(c)) { textureStore(vel_aus, c, vec4f(0.0)); return; }
  let p0 = textureLoad(druck, c, 0).r;
  let g = 0.5 * vec3f(p_nb(c + vec3i(1, 0, 0), p0) - p_nb(c - vec3i(1, 0, 0), p0),
                      p_nb(c + vec3i(0, 1, 0), p0) - p_nb(c - vec3i(0, 1, 0), p0),
                      p_nb(c + vec3i(0, 0, 1), p0) - p_nb(c - vec3i(0, 0, 1), p0));
  var u = textureLoad(vel, c, 0).xyz - sauber3(g, 1e5);
  // Undurchlässige Wand: keine Komponente in eine feste Nachbarzelle hinein
  for (var k = 0; k < 3; k++) {
    var d = vec3i(0); d[k] = 1;
    if (drin(c + d) && fest(c + d)) { u[k] = min(u[k], 0.0); }
    if (drin(c - d) && fest(c - d)) { u[k] = max(u[k], 0.0); }
  }
  // Geschwindigkeitsgrenze in Welteinheiten je Sekunde (nicht an Zeitschritt oder Auflösung gekoppelt)
  let vmax = P.phase2.w / P.zeit.y;
  u = sauber3(u, 6e4);
  let l = length(u);
  if (l > vmax) { u *= vmax / l; }
  textureStore(vel_aus, c, vec4f(u, 0.0));
}
`,"gas_quellen.wgsl":`// Gas-Löser, Schritt 1: Quellen, Wärmeübergang an festen Wänden, Phasenwechsel, Abkühlung, Zerfall.
#include "gas_gemeinsam.wgsl"

@group(0) @binding(0) var<uniform> P: GasP;
@group(0) @binding(1) var skal_ein: texture_3d<f32>;
@group(0) @binding(2) var vel_ein: texture_3d<f32>;
@group(0) @binding(3) var quell_s: texture_3d<f32>;   // Raten/s: Kondensat, Wärme [K/s], Dampf, Staub
@group(0) @binding(4) var quell_v: texture_3d<f32>;   // Beschleunigung [Zellen/s²]
@group(0) @binding(5) var rand: texture_3d<f32>;      // r = Abstand zur Wand [Zellen] (<0 = fest), g = Wandtemperatur [K]
@group(0) @binding(6) var skal_aus: texture_storage_3d<rgba16float, write>;
@group(0) @binding(7) var vel_aus: texture_storage_3d<rgba16float, write>;

@compute @workgroup_size(4, 4, 4)
fn quellen(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= P.n.xyz)) { return; }
  let c = vec3i(id);
  let dt = P.zeit.x;
  var s = textureLoad(skal_ein, c, 0);
  var u = textureLoad(vel_ein, c, 0).xyz;
  let w = textureLoad(rand, c, 0);
  let p = vec3f(id) + 0.5;
  let ob = oben_bei(P, p);
  let Ta = T_umgebung(P, ob.w);

  // Im Festkörper: kein Gas, Temperatur = Wand, ruhend
  if (w.r < 0.0) {
    textureStore(skal_aus, c, vec4f(0.0, w.g, 0.0, 0.0));
    textureStore(vel_aus, c, vec4f(0.0));
    return;
  }

  // Quellen (explizit, nicht negativ)
  let q = textureLoad(quell_s, c, 0);
  s = max(s + dt * sauber4(q, 1e7), vec4f(0.0));
  u += dt * sauber3(textureLoad(quell_v, c, 0).xyz, 1e6);

  // Wärmeübergang an der Wand (Newton): dT/dt = k_w (T_wand − T), nur in der ersten Zellschicht
  let nahe = clamp(1.5 - w.r, 0.0, 1.0);
  s.g += (w.g - s.g) * (1.0 - exp(-P.wirbel.w * nahe * dt));

  // Adiabatische Abkühlung beim Steigen: dT/dt = −Γ_ad · w_auf
  s.g -= P.umgebung.z * dot(u, ob.xyz) * dt;

  // Phasenwechsel zur Sättigung nach Clausius-Clapeyron, Relaxationszeit τ.
  // m > 0: Dampf kondensiert (setzt Latentwärme frei), m < 0: Kondensat verdampft (kühlt).
  let qs = q_saettigung(P, s.g);
  let m = clamp((s.b - qs) * (1.0 - exp(-dt / P.phase.w)), -s.r, s.b);
  s.b -= m;
  s.r += m;
  s.g += m * P.phase2.x;

  // Abkühlung Richtung Umgebung: Newton (exakt) + Strahlung εσ(T⁴ − T_a⁴) (explizit, nicht unter T_a)
  s.g = Ta + (s.g - Ta) * exp(-P.wirbel.y * dt);
  let T4 = s.g * s.g * s.g * s.g - Ta * Ta * Ta * Ta;
  let dT = P.wirbel.z * T4 * 1e-9 * dt;
  s.g = select(min(s.g, max(s.g - dT, Ta)), max(s.g, min(s.g - dT, Ta)), s.g < Ta);
  s.g = clamp(s.g, 3.0, P.phase2.z);

  // Schwamm am offenen Rand: Rauch und Dampf klingen in den äußeren 20 % des Gitters aus (kein harter Block am Gitterrand,
  // ein Wellenreflexionsfilter in der Art der „absorbing layer“ numerischer Strömungsrechnung)
  let nn = vec3f(P.n.xyz);
  let dr = min(min(min(p.x, nn.x - p.x), min(p.y, nn.y - p.y)), min(p.z, nn.z - p.z));
  let sw = P.zerfall.w * (1.0 - smoothstep(0.0, 0.2 * min(nn.x, min(nn.y, nn.z)), dr));
  s.r *= exp(-sw * dt); s.a *= exp(-sw * dt); s.b *= exp(-sw * dt);

  // Zerfall (Ausregnen, Verdünnung unterhalb der Gitterauflösung)
  s.r *= exp(-P.zerfall.x * dt);
  s.a *= exp(-P.zerfall.y * dt);
  s.b *= exp(-P.zerfall.z * dt);

  // Begrenzung: Mengen nach oben (fp16 fasst bis 65504), Temperatur ≤ T_max
  s = vec4f(clamp(sauber(s.r, 1e4), 0.0, 1e3), clamp(sauber(s.g, 1e4), 3.0, P.phase2.z), clamp(sauber(s.b, 1e4), 0.0, 1e3), clamp(sauber(s.a, 1e4), 0.0, 1e3));
  textureStore(skal_aus, c, s);
  textureStore(vel_aus, c, vec4f(sauber3(u, 6e4), 0.0));
}
`,"poisson_mehrgitter.wgsl":`// Allgemeiner Poisson-Löser ∇²p = b auf einem zellzentrierten 3D-Gitter, geometrisches Mehrgitter (V-Zyklus).
// Quelle: Briggs, Henson, McCormick, „A Multigrid Tutorial“ (2. Aufl., SIAM 2000), Kap. 3–4;
//         Randbehandlung mit Abstandsfeld wie in Bridson, „Fluid Simulation for Computer Graphics“ (2. Aufl.), Kap. 5.
// Ränder: Festkörper (Abstandsfeld < 0) = Neumann (Nachbar fällt aus der Summe), Gitterrand = Dirichlet p = 0
//         (offener Rand, Gas darf hinaus). Dadurch ist das System auf jeder Stufe definit.
// Gedämpfte Gleichung (∇² − κ) p = b: eine kleine Kompressibilität κ = 1/Λ² macht auch abgeschlossene Taschen lösbar.
// Ohne κ hat ein ringsum von Festkörper umschlossenes Gasgebiet mit Quelle (z. B. der Schnittspalt) keine Lösung (reines
// Neumann-Problem, Kompatibilitätsbedingung verletzt) und der Druck wuchs ohne Grenze, bis die Geschwindigkeit NaN wurde.
// Glätter: Rot-Schwarz-Gauß-Seidel in place. Restriktion: Mittel der 8 Kinder. Prolongation: trilinear.

struct Stufe {
  n: vec4u,  // nx, ny, nz (dieser Stufe), Farbe (0/1) für Rot-Schwarz
  h: vec4f,  // h dieser Stufe in Feinzellen (2^l), Feinzellen je Zelle (2^l), Iterationsgewicht ω, κ (1/Feinzelle²)
};

@group(0) @binding(0) var<uniform> S: Stufe;
@group(0) @binding(1) var rand: texture_3d<f32>;                              // Abstandsfeld (feinstes Gitter)
@group(0) @binding(2) var p: texture_storage_3d<r32float, read_write>;        // Lösung dieser Stufe
@group(0) @binding(3) var b: texture_3d<f32>;                                 // rechte Seite dieser Stufe
@group(0) @binding(4) var aus: texture_storage_3d<r32float, write>;
@group(0) @binding(5) var grob: texture_3d<f32>;                              // Lösung der gröberen Stufe

fn fest(c: vec3i) -> bool {
  let f = vec3i((vec3f(c) + 0.5) * S.h.y);
  return textureLoad(rand, f, 0).r < 0.0;
}
fn drin(c: vec3i) -> bool { return all(c >= vec3i(0)) && all(c < vec3i(S.n.xyz)); }

// Summe der Nachbarwerte und Anzahl der nicht-festen Nachbarn (Gitterrand zählt mit Wert 0)
fn nachbarn(c: vec3i) -> vec2f {
  var sum = 0.0; var anz = 0.0;
  for (var k = 0; k < 6; k++) {
    var d = vec3i(0);
    d[k / 2] = select(-1, 1, (k & 1) == 1);
    let q = c + d;
    if (!drin(q)) { anz += 1.0; continue; }
    if (fest(q)) { continue; }
    sum += textureLoad(p, q).r;
    anz += 1.0;
  }
  return vec2f(sum, anz);
}

@compute @workgroup_size(4, 4, 4)
fn glaetten(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= S.n.xyz)) { return; }
  let c = vec3i(id);
  if (((id.x + id.y + id.z) & 1u) != S.n.w) { return; }
  if (fest(c)) { textureStore(p, c, vec4f(0.0)); return; }
  let nb = nachbarn(c);
  let h2 = S.h.x * S.h.x;
  let gs = (nb.x - h2 * textureLoad(b, c, 0).r) / max(nb.y + h2 * S.h.w, 1.0e-3);
  let alt = textureLoad(p, c).r;
  textureStore(p, c, vec4f(mix(alt, gs, S.h.z)));
}

@compute @workgroup_size(4, 4, 4)
fn residuum(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= S.n.xyz)) { return; }
  let c = vec3i(id);
  if (fest(c)) { textureStore(aus, c, vec4f(0.0)); return; }
  let nb = nachbarn(c);
  let lap = (nb.x - (nb.y + S.h.x * S.h.x * S.h.w) * textureLoad(p, c).r) / (S.h.x * S.h.x);
  textureStore(aus, c, vec4f(textureLoad(b, c, 0).r - lap));
}

// Aufruf auf der GROBEN Stufe: b = Residuum der feinen Stufe, aus = rechte Seite grob, p = Lösung grob (wird genullt)
@compute @workgroup_size(4, 4, 4)
fn restriktion(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= S.n.xyz)) { return; }
  let c = vec3i(id);
  let nf = vec3i(textureDimensions(b));
  var sum = 0.0;
  for (var k = 0; k < 8; k++) {
    let f = min(2 * c + vec3i(k & 1, (k >> 1) & 1, (k >> 2) & 1), nf - 1);
    sum += textureLoad(b, f, 0).r;
  }
  textureStore(aus, c, vec4f(sum * 0.125));
  textureStore(p, c, vec4f(0.0));
}

// Aufruf auf der FEINEN Stufe: p += trilinear interpolierte Grob-Korrektur
@compute @workgroup_size(4, 4, 4)
fn prolongation(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= S.n.xyz)) { return; }
  let c = vec3i(id);
  if (fest(c)) { return; }
  let ng = vec3i(textureDimensions(grob));
  let x = (vec3f(c) + 0.5) * 0.5 - 0.5;
  let b0 = vec3i(floor(x));
  let t = x - floor(x);
  var e = 0.0;
  for (var k = 0; k < 8; k++) {
    let o = vec3i(k & 1, (k >> 1) & 1, (k >> 2) & 1);
    let q = b0 + o;
    let w = mix(1.0 - t, t, vec3f(o));
    var v = 0.0;
    if (all(q >= vec3i(0)) && all(q < ng)) { v = textureLoad(grob, q, 0).r; }
    e += w.x * w.y * w.z * v;
  }
  textureStore(p, c, vec4f(textureLoad(p, c).r + e));
}
`,"koerper.wgsl":`// Körper: Wärme und Abtrag in einem festen Körper (Ruhegitter, Abstandsfeld φ).
// Energiebilanz je Zelle:  ρc ∂T/∂t = ∇·(k∇T) + q_Strahl − εσ(T⁴ − T_u⁴)·A/V
//   q_Strahl = a · I · e^(−s/δ) / δ        (Absorption in einer Schicht der Dicke δ, s = Tiefe)
// Abtrag (Verdampfen): Energie oberhalb T_v geht in die Verdampfungswärme L:
//   Δφ = h · c (T − T_v) / L,  T ← T_v       → die Oberfläche wandert nach innen (Pegelmengen-Methode,
//   Osher & Sethian 1988); kein Skript für den Schnitt – er folgt aus der Energie.
// Danach Lipschitz-Bedingung |∇φ| ≤ 1 im Inneren erzwingen (φ_i ≥ max φ_Nachbar − h), damit φ ein Abstandsfeld
// bleibt und die Kugelverfolgung sicher ist.
#include "koerper_feld.wgsl"
#include "../strahl/strahl_feld.wgsl"

@group(0) @binding(0) var<uniform> K: Koerper;
@group(0) @binding(1) var<uniform> S: Strahl;
@group(0) @binding(2) var<storage, read> Tr: Treffer;
@group(0) @binding(3) var zein: texture_3d<f32>;
@group(0) @binding(4) var zaus: texture_storage_3d<rgba32float, write>;
@group(0) @binding(5) var anzeige: texture_storage_3d<rgba16float, write>;

fn ld(c: vec3i) -> vec4f { return textureLoad(zein, clamp(c, vec3i(0), vec3i(K.vol.n.xyz) - 1), 0); }

// Welche Teil-Lage gilt für diese Ruhelage-Position?
fn teil_von(x0: vec3f) -> Teil {
  let t0 = K.teil[0];
  if (t0.c0.w == 0.0) { return t0; }
  let s = sign(dot(K.ebene.xyz, x0) - K.ebene.w);
  if (s == sign(t0.c0.w)) { return t0; }
  return K.teil[1];
}
fn welt_von(t: Teil, x0: vec3f) -> vec3f {
  let d = x0 - t.c0.xyz;
  return t.c.xyz + t.m0.xyz * d.x + t.m1.xyz * d.y + t.m2.xyz * d.z;
}

@compute @workgroup_size(4, 4, 4)
fn schritt(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= K.vol.n.xyz)) { return; }
  let c = vec3i(id);
  let h = K.vol.mitte.w;
  let dt = K.mat3.y;
  let Tu = K.mat2.y;
  var z = textureLoad(zein, c, 0);   // φ, T, Abtragrate, Schmelzgrad
  var phi = z.r; var T = z.g; var rate = z.b * exp(-dt * 6.0); var schmelz = z.a;

  var tmax = Tu; var phimax = -1e9; var lap = 0.0; var ratemax = 0.0;
  for (var k = 0; k < 6; k++) {
    var d = vec3i(0); d[k / 2] = select(-1, 1, (k & 1) == 1);
    let n = ld(c + d);
    phimax = max(phimax, n.r);
    ratemax = max(ratemax, n.b);
    if (n.r < 0.5 * h) { tmax = max(tmax, n.g); }
    if (n.r < 0.0) { lap += n.g - T; }
  }

  if (phi < 0.5 * h) {
    // Strahlheizung (Strahl in Welt, Zelle in Ruhelage → Weltlage des eigenen Teils)
    let x0 = zelle_zu_welt(K.vol, vec3f(id) + 0.5);
    let x = welt_von(teil_von(x0), x0);
    // Eindringtiefe: physikalisch δ, im Gitter mindestens 1,5 Zellen (sonst liegt keine Zelle innerhalb weniger δ unter der Fläche und das
    // Bohren hinge davon ab, ob zufällig eine Zellmitte dort liegt – grobe Gitter bohrten dadurch viel langsamer).
    // Normierung (1 − e^(−h/ε))/h: die Summe über die Zellen entlang der Normalen ergibt genau den Strahlfluss (Energieerhaltung).
    let delta = max(K.mat2.x, 1.5 * h);
    let f = strahl_feld(S, x);
    var tiefe = max(-phi, 0.0);
    if (Tr.normale.w > 0.5 && Tr.normale.w < 1.5) { tiefe = max(tiefe, f.y - Tr.pos.w); }
    let q = f.x * exp(-tiefe / delta) * (1.0 - exp(-h / delta)) / h;
    T += K.mat3.x * q * dt;

    // Wärmeleitung (explizit, stabil für D·dt/h² ≤ 1/6)
    if (phi < 0.0) { T += min(K.mat.z * dt / (h * h), 0.16) * lap; }

    // Abstrahlung der obersten Schicht – nach dem Bruch auch die frische Schnittfläche (sie liegt in der Bruchebene)
    let schnitt = K.teil[0].c0.w != 0.0 && abs(dot(K.ebene.xyz, x0) - K.ebene.w) < 1.2 * h;
    // frische Schnittfläche glüht nach dem Bruch (heißes Innere), klingt über einige Sekunden ab
    if (schnitt && K.mat4.y > 0.0) { T = max(T, 2600.0 * exp(-0.45 * max(K.mat3.z - K.mat4.y, 0.0))); }
    if (phi > -h || schnitt) {
      let T4 = T * T * T * T - Tu * Tu * Tu * Tu;
      T = max(T - K.mat.w * 1e-9 * T4 * dt / max(K.mat4.x, 1e-6), min(T, Tu));
    }

    // Schmelzen hinterlässt Schlacke (bleibt sichtbar), Verdampfen trägt ab
    schmelz = max(schmelz, smoothstep(K.mat2.z - 150.0, K.mat2.z + 150.0, T));
    if (T > K.mat.x) {
      let dphi = h * (T - K.mat.x) * K.mat.y;
      phi += dphi;
      rate = max(rate, dphi / dt);
      T = K.mat.x;
    }
  } else {
    // Außen: Temperatur der nahen Wand fortsetzen (für Darstellung und Gas-Kopplung), sonst Umgebung
    T = select(Tu, tmax, phi < 1.5 * h);
    rate = max(rate, 0.85 * ratemax * step(phi, 2.5 * h));
  }

  // Lipschitz im Inneren: Fläche, die zurückweicht, zieht das innere Abstandsfeld mit
  if (phi < 0.0) { phi = max(phi, phimax - h); }

  let o = vec4f(phi, T, rate, schmelz);
  textureStore(zaus, c, o);
  textureStore(anzeige, c, o);
}

// ---- Bruch erkennen: feste Zellen in der Schnittschicht zählen, Masse und Schwerpunkt je Seite -----------------
struct Zaehler {
  schicht: atomic<u32>,
  plus: array<atomic<u32>, 4>,   // Anzahl, Σx, Σy, Σz (Zellindizes)
  minus: array<atomic<u32>, 4>,
};
@group(0) @binding(6) var<storage, read_write> Z: Zaehler;

@compute @workgroup_size(4, 4, 4)
fn zaehlen(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= K.vol.n.xyz)) { return; }
  let phi = textureLoad(zein, vec3i(id), 0).r;
  if (phi >= 0.0) { return; }
  let x0 = zelle_zu_welt(K.vol, vec3f(id) + 0.5);
  let a = dot(K.ebene.xyz, x0) - K.ebene.w;
  if (abs(a) < 1.5 * K.vol.mitte.w) { atomicAdd(&Z.schicht, 1u); }
  if (a >= 0.0) {
    atomicAdd(&Z.plus[0], 1u); atomicAdd(&Z.plus[1], id.x); atomicAdd(&Z.plus[2], id.y); atomicAdd(&Z.plus[3], id.z);
  } else {
    atomicAdd(&Z.minus[0], 1u); atomicAdd(&Z.minus[1], id.x); atomicAdd(&Z.minus[2], id.y); atomicAdd(&Z.minus[3], id.z);
  }
}
`,"koerper_anfang.wgsl":`// Körper: Anfangsform. Die Objektdatei (z. B. objekte/mond.wgsl) liefert fn form_sdf(p, groesse) -> f32,
// p relativ zur Gittermitte in Welteinheiten. Diese Datei wird hinter die Objektdatei gehängt.
#include "koerper_feld.wgsl"

@group(0) @binding(0) var<uniform> K: Koerper;
@group(0) @binding(4) var zaus: texture_storage_3d<rgba32float, write>;
@group(0) @binding(5) var anzeige: texture_storage_3d<rgba16float, write>;

@compute @workgroup_size(4, 4, 4)
fn form(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= K.vol.n.xyz)) { return; }
  let x0 = zelle_zu_welt(K.vol, vec3f(id) + 0.5);
  let phi = form_sdf(x0 - K.vol.mitte.xyz, K.mat3.w);
  let o = vec4f(phi, K.mat2.y, 0.0, 0.0);
  textureStore(zaus, vec3i(id), o);
  textureStore(anzeige, vec3i(id), o);
}
`,"koerper_bild.wgsl":`// Körper: Oberfläche zeichnen – für jeden Körper aus koerper_feld.wgsl gleich.
// Reflexion: Lambert + weiche Eigenschatten (Kugelverfolgung Richtung Licht, Quilez 2010 Penumbra-Schätzer).
// Eigenleuchten (Kirchhoff): L = ε · B(T)  mit B aus der Planck-Tabelle → die Narbe glüht physikalisch richtig
// nach: weiß-gelb beim Schneiden, dann orange, dunkelrot, aus (Abkühlung über Strahlung und Leitung).
// Schlacke (einmal geschmolzen) bleibt dunkel und glasig.
#include "koerper_feld.wgsl"
#include "../../licht/planck_lesen.wgsl"

struct KoerperTreffer { t: f32, x0: vec3f, n: vec3f, f: vec4f };

fn koerper_schatten(K: Koerper, tex: texture_3d<f32>, smp: sampler, x: vec3f, l: vec3f) -> f32 {
  var s = 1.0;
  var t = 2.0 * K.vol.mitte.w;
  for (var i = 0; i < 40; i++) {
    let d = koerper_probe(K, tex, smp, x + l * t).r;
    s = min(s, 10.0 * d / t);
    if (s < 0.01 || d > 2.0 * K.vol.ax.w) { break; }
    t += clamp(d, K.vol.mitte.w, 0.2 * K.vol.ax.w);
  }
  return clamp(s, 0.0, 1.0);
}

// Gesteinsfarbe aus der Ruhelage (bleibt am Material „kleben“, auch wenn sich die Teile bewegen).
// Weiches Wertrauschen in drei Oktaven (statt Zellblöcken): großflächige Maria-Tönung, mittlere Flecken, feines Korn.
fn gs_hash(p: vec3f) -> f32 { return fract(sin(dot(p, vec3f(127.1, 311.7, 74.7))) * 43758.5453); }
fn gs_rausch(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  var s = 0.0;
  for (var k = 0; k < 8; k++) {
    let o = vec3f(f32(k & 1), f32((k >> 1) & 1), f32((k >> 2) & 1));
    let w = mix(1.0 - u, u, o);
    s += gs_hash(i + o) * w.x * w.y * w.z;
  }
  return s;
}
fn gestein_albedo(x0: vec3f, R: f32) -> vec3f {
  let p = x0 / R;
  let gross = gs_rausch(p * 2.2 + 3.1);
  let mittel = gs_rausch(p * 7.0);
  let fein = gs_rausch(p * 26.0);
  let ton = 0.62 + 0.55 * (gross - 0.5) + 0.28 * (mittel - 0.5) + 0.14 * (fein - 0.5);
  return mix(vec3f(0.44, 0.40, 0.35), vec3f(0.36, 0.34, 0.33), smoothstep(0.35, 0.7, gross)) * ton * 1.5;
}

fn koerper_farbe(K: Koerper, tex: texture_3d<f32>, smp: sampler, planck: texture_1d<f32>,
                 x: vec3f, rd: vec3f, sonne: vec4f, gluehen: f32, tint: vec3f) -> vec3f {
  let n = koerper_normale(K, tex, smp, x);
  // Temperatur knapp unter der Oberfläche lesen (dort liegt das Material, nicht die Gasgrenze)
  let f = koerper_probe(K, tex, smp, x - n * 0.7 * K.vol.mitte.w);
  // Ruhelage für die Textur: Teil mit kleinstem Abstand
  var x0 = x;
  var best = 1e9;
  for (var i = 0; i < 2; i++) {
    if (K.teil[i].c.w < 0.5) { continue; }
    let d = teil_probe(K, K.teil[i], tex, smp, x).r;
    if (d < best) { best = d; x0 = teil_ruhelage(K.teil[i], x) - K.vol.mitte.xyz; }
  }
  var alb = gestein_albedo(x0, K.mat3.w) * tint;
  alb = mix(alb, vec3f(0.06, 0.05, 0.05), f.a * 0.85);
  let ndl = max(dot(n, sonne.xyz), 0.0);
  let sch = select(1.0, koerper_schatten(K, tex, smp, x + n * K.vol.mitte.w, sonne.xyz), ndl > 0.0);
  var c = alb * sonne.w * ndl * sch + alb * 0.015;
  // glasige Schlacke: Spiegelanteil nach Schlick (n = 1.5 → F0 = 0.04)
  let hv = normalize(sonne.xyz - rd);
  let F = 0.04 + 0.96 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
  c += f.a * F * pow(max(dot(n, hv), 0.0), 80.0) * sonne.w * sch;
  // Eigenleuchten ε B(T), ε ≈ 0.9 für Gestein/Schmelze
  c += 0.9 * planck_rgb(planck, f.g) * gluehen;
  return c;
}
`,"koerper_feld.wgsl":`// Körper: Abfragen eines festen Körpers aus beliebigen Shadern (Strahl, Kopplung, Funken, Darstellung).
// Der Körper lebt in seinem Ruhegitter (Volumen in Ausgangslage). Nach einem Bruch besteht er aus bis zu
// zwei starren Teilen; jedes Teil ist das Ruhegitter ∩ Halbraum, bewegt mit eigener Lage (Schwerpunkt + Drehung).
//   Welt → Ruhelage:  x₀ = c₀ + M (x − c)        (M = Drehung Welt → Ruhelage)
// Feld: r = Abstand φ [Welt] (> 0 außen), g = Temperatur [K], b = Abtragrate [Welt/s], a = Schmelzgrad.
#include "../../kern/raum.wgsl"

struct Teil {
  c: vec4f,    // Schwerpunkt in der Welt, w = aktiv (0/1)
  c0: vec4f,   // Schwerpunkt in Ruhelage, w = Seite (+1/−1) bezüglich der Bruchebene, 0 = ganzer Körper
  m0: vec4f,   // Zeilen von M
  m1: vec4f,
  m2: vec4f,
};
struct Koerper {
  vol: Volumen,
  teil: array<Teil, 2>,
  ebene: vec4f,  // Bruchebene in Ruhelage: n·x₀ = d
  mat: vec4f,    // T_verdampfen [K], Abtrag c/L [1/K], Wärmeleitung D [Welt²/s], Strahlungskühlung
  mat2: vec4f,   // Absorptionslänge δ [Welt], T_umgebung [K], Schmelztemperatur [K], vorhanden (0/1)
  mat3: vec4f,   // Absorptionsgrad/(ρc) [K·Welt³/Energie], dt [s], Zeit [s], Radius
  mat4: vec4f,   // Dicke der abstrahlenden Haut [Welt], -, -, -
};

fn teil_ruhelage(t: Teil, x: vec3f) -> vec3f {
  let d = x - t.c.xyz;
  return t.c0.xyz + vec3f(dot(t.m0.xyz, d), dot(t.m1.xyz, d), dot(t.m2.xyz, d));
}

// Feldwert eines Teils an Weltposition x
fn teil_probe(K: Koerper, t: Teil, tex: texture_3d<f32>, smp: sampler, x: vec3f) -> vec4f {
  let x0 = teil_ruhelage(t, x);
  let z = welt_zu_zelle(K.vol, x0);
  let n = vec3f(K.vol.n.xyz);
  let zk = clamp(z, vec3f(0.5), n - 0.5);
  var f = textureSampleLevel(tex, smp, zk / n, 0.0);
  f.r += length(z - zk) * K.vol.mitte.w;   // außerhalb des Gitters: Abstand zum Rand dazu
  if (t.c0.w != 0.0) {
    let dp = t.c0.w * (dot(K.ebene.xyz, x0) - K.ebene.w);
    f.r = max(f.r, -dp);
  }
  return f;
}

// Vereinigung aller aktiven Teile: (φ, T, Abtragrate, Schmelzgrad) des nächsten Teils
fn koerper_probe(K: Koerper, tex: texture_3d<f32>, smp: sampler, x: vec3f) -> vec4f {
  var best = vec4f(1e6, K.mat2.y, 0.0, 0.0);
  if (K.mat2.w < 0.5) { return best; }
  for (var i = 0; i < 2; i++) {
    let t = K.teil[i];
    if (t.c.w < 0.5) { continue; }
    let f = teil_probe(K, t, tex, smp, x);
    if (f.r < best.r) { best = f; }
  }
  return best;
}

fn koerper_normale(K: Koerper, tex: texture_3d<f32>, smp: sampler, x: vec3f) -> vec3f {
  let e = K.vol.mitte.w;
  let dx = koerper_probe(K, tex, smp, x + vec3f(e, 0.0, 0.0)).r - koerper_probe(K, tex, smp, x - vec3f(e, 0.0, 0.0)).r;
  let dy = koerper_probe(K, tex, smp, x + vec3f(0.0, e, 0.0)).r - koerper_probe(K, tex, smp, x - vec3f(0.0, e, 0.0)).r;
  let dz = koerper_probe(K, tex, smp, x + vec3f(0.0, 0.0, e)).r - koerper_probe(K, tex, smp, x - vec3f(0.0, 0.0, e)).r;
  return normalize(vec3f(dx, dy, dz) + vec3f(0.0, 1e-7, 0.0));
}

// Kugelverfolgung (Hart 1996, „Sphere Tracing“) entlang ro + t·rd, liefert t des Treffers oder −1
fn koerper_verfolgen(K: Koerper, tex: texture_3d<f32>, smp: sampler, ro: vec3f, rd: vec3f, tmax: f32) -> f32 {
  if (K.mat2.w < 0.5) { return -1.0; }
  // nur innerhalb der Hüllkugel des Ruhegitters (je Teil)
  let rh = length(vec3f(K.vol.ax.w, K.vol.ay.w, K.vol.az.w));
  var t0 = 1e9; var t1 = -1e9;
  for (var i = 0; i < 2; i++) {
    let tl = K.teil[i];
    if (tl.c.w < 0.5) { continue; }
    let oc = ro - tl.c.xyz;
    let r = rh + length(tl.c0.xyz - K.vol.mitte.xyz);
    let b = dot(oc, rd);
    let disk = b * b - (dot(oc, oc) - r * r);
    if (disk < 0.0) { continue; }
    let s = sqrt(disk);
    t0 = min(t0, -b - s); t1 = max(t1, -b + s);
  }
  if (t1 < 0.0 || t0 > tmax) { return -1.0; }
  var t = max(t0, 0.0);
  let eps = 0.35 * K.vol.mitte.w;
  for (var k = 0; k < 160; k++) {
    let d = koerper_probe(K, tex, smp, ro + t * rd).r;
    if (d < eps) { return t; }
    t += max(d * 0.9, 0.25 * K.vol.mitte.w);
    if (t > min(t1, tmax)) { break; }
  }
  return -1.0;
}
`,"kopplung.wgsl":`// Kopplung: übersetzt Strahl + Körper in Randbedingungen und Quellraten eines Gasvolumens.
// Nur hier treffen die Module aufeinander – Gas-Löser, Körper und Strahl bleiben einzeln verwendbar.
//  • Wand:      rand = (φ / h_gas, T_Wand)
//  • Abtrag:    abgetragenes Volumen je Zeit (Rate · Fläche) wird Dampf + Staub mit T_v; der Dampf verlässt
//               die Fläche entlang der Normalen (Knudsen-Schicht, ~ Schallgeschwindigkeit) mit Rückstoßanteil
//               gegen den Strahl.
//  • Medium:    q = κ(h) · I · e^(−τ)  (Chapman-Heizung) → Wärmerate in K/s
//  • Rauch im Strahl absorbiert ebenfalls: q = k_R · (Kondensat + Staub) · I
#include "../strahl/strahl_feld.wgsl"
#include "../koerper/koerper_feld.wgsl"

struct Kopplung {
  abtrag: vec4f,  // Dampf je Abtrag, Staub je Abtrag, Strahlgeschwindigkeit [Welt/s], Rückstoßanteil
  heiz: vec4f,    // Medium-Heizung [K·Welt³/Energie], Rauch-Heizung, Dampftemperatur [K], Ansprechrate [1/s]
  grenze: vec4f,  // größte Heizrate im Medium [K/s], -, -, -
};

@group(0) @binding(0) var<uniform> V: Volumen;
@group(0) @binding(1) var<uniform> S: Strahl;
@group(0) @binding(2) var<storage, read> Tr: Treffer;
@group(0) @binding(3) var<uniform> K: Koerper;
@group(0) @binding(4) var feld: texture_3d<f32>;
@group(0) @binding(5) var lin: sampler;
@group(0) @binding(6) var<uniform> C: Kopplung;
@group(0) @binding(7) var skal: texture_3d<f32>;
@group(0) @binding(8) var rand_aus: texture_storage_3d<rgba16float, write>;
@group(0) @binding(9) var quell_s: texture_storage_3d<rgba32float, write>;
@group(0) @binding(10) var quell_v: texture_storage_3d<rgba32float, write>;

@compute @workgroup_size(4, 4, 4)
fn koppeln(@builtin(global_invocation_id) id: vec3u) {
  if (any(id >= V.n.xyz)) { return; }
  let c = vec3i(id);
  let h = V.mitte.w;
  let x = zelle_zu_welt(V, vec3f(id) + 0.5);
  let s = textureLoad(skal, c, 0);
  var qs = vec4f(0.0);
  var qv = vec3f(0.0);

  // Wand
  let kf = koerper_probe(K, feld, lin, x);
  textureStore(rand_aus, c, vec4f(clamp(kf.r / h, -64.0, 64.0), kf.g, 0.0, 0.0));

  // Abtrag → Dampf + Staub + Strahl
  if (kf.b > 0.0 && kf.r > -0.5 * h && kf.r < 2.5 * h) {
    let menge = kf.b / h;   // abgetragener Volumenanteil je Zelle und Sekunde
    let nrm = koerper_normale(K, feld, lin, x);
    let dir = normalize(nrm - C.abtrag.w * S.richtung.xyz);
    let anspr = clamp(menge * C.heiz.w, 0.0, 1.0);
    qs.b += C.abtrag.x * menge;
    qs.a += C.abtrag.y * menge;
    qs.g += (C.heiz.z - s.g) * anspr * 30.0;
    qv += richtung_zu_zelle(V, dir) * (C.abtrag.z / h) * anspr * 30.0;
  }

  // Strahlheizung im Medium und am Rauch
  let I = strahl_intensitaet(S, Tr, x, K.mat2.x);
  if (I > 0.0) {
    qs.g += min(C.heiz.x * medium_kappa(S, x) * I + C.heiz.y * (s.r + s.a) * I, C.grenze.x);
  }

  textureStore(quell_s, c, qs);
  textureStore(quell_v, c, vec4f(qv, 0.0));
}
`,"strahl_feld.wgsl":`// Strahl: Energiefeld eines gebündelten Strahls – unabhängig davon, wer ihn aussendet (Todesstern, Laser, Turm …).
// Gauß-Strahl (Siegman, „Lasers“, Kap. 17):
//   w(z) = w₀ √(1 + ((z − z_T)/z_R)²),   I(r, z) = 2P / (π w²) · exp(−2 r² / w²)
// Abschwächung im Medium (Beer-Lambert), exponentielle Atmosphäre κ(h) = κ₀ e^(−h/H):
//   τ(h) = ∫ κ ds = κ(h) · H / μ   (μ = Kosinus Strahl ↔ Lotrichtung, ebene Schichtung)
//   I(h) = I_frei · e^(−τ),   deponierte Leistung je Volumen q = κ(h) · I(h)
//   → Maximum bei τ = 1: die Chapman-Schicht (Chapman 1931). Dort heizt der Strahl am stärksten.
// Hinter dem Treffpunkt auf festem Grund: e^(−s/δ) mit Eindringtiefe δ.

struct Strahl {
  quelle: vec4f,    // Ursprung (Welt), w = aktiv
  richtung: vec4f,  // Einheitsvektor, w = Leistung P
  form: vec4f,      // w₀ [Welt], z_R [Welt], z_T Taillenabstand [Welt], Zeit [s]
  medium: vec4f,    // Planetenmitte, w = κ₀ am Bezugsradius [1/Welt]
  medium2: vec4f,   // Bezugsradius R, Skalenhöhe H, Obergrenze R_oben, vorhanden (0/1)
  farbe: vec4f,     // Darstellungsfarbe rgb, Helligkeit
};

// Vom Treffer-Rechner geschrieben (GPU), von allen Verbrauchern gelesen – kein Rücklesen zur CPU nötig.
struct Treffer {
  pos: vec4f,      // Treffpunkt (Welt), w = t entlang der Achse
  normale: vec4f,  // Oberflächennormale, w = Art (0 nichts, 1 fester Körper, 2 Medium)
  info: vec4f,     // t Eintritt ins Medium, t bei τ = 1, Abtragrate am Treffpunkt, -
};

fn strahl_radius(S: Strahl, z: f32) -> f32 {
  let u = (z - S.form.z) / S.form.y;
  return S.form.x * sqrt(1.0 + u * u);
}

fn medium_kappa(S: Strahl, x: vec3f) -> f32 {
  if (S.medium2.w < 0.5) { return 0.0; }
  let r = length(x - S.medium.xyz);
  if (r > S.medium2.z) { return 0.0; }
  return S.medium.w * exp(-(r - S.medium2.x) / S.medium2.y);
}

fn medium_tau(S: Strahl, x: vec3f) -> f32 {
  let k = medium_kappa(S, x);
  if (k <= 0.0) { return 0.0; }
  let mu = max(abs(dot(S.richtung.xyz, normalize(x - S.medium.xyz))), 0.08);
  return k * S.medium2.y / mu;
}

// (Intensität ohne Festkörper-Abschattung, z entlang der Achse, r Abstand zur Achse, Medium-Transmission)
fn strahl_feld(S: Strahl, x: vec3f) -> vec4f {
  if (S.quelle.w < 0.5) { return vec4f(0.0); }
  let d = x - S.quelle.xyz;
  let z = dot(d, S.richtung.xyz);
  if (z < 0.0) { return vec4f(0.0, z, 1e9, 0.0); }
  let r = length(d - z * S.richtung.xyz);
  let w = strahl_radius(S, z);
  let tr = exp(-medium_tau(S, x));
  let I = 2.0 * S.richtung.w / (3.14159265 * w * w) * exp(-2.0 * r * r / (w * w));
  return vec4f(I * tr, z, r, tr);
}

// Intensität mit Abschattung durch den Treffpunkt auf festem Grund (Eindringtiefe δ)
fn strahl_intensitaet(S: Strahl, T: Treffer, x: vec3f, delta: f32) -> f32 {
  let f = strahl_feld(S, x);
  if (T.normale.w > 0.5 && T.normale.w < 1.5) {
    let s = f.y - T.pos.w;
    if (s > 0.0) { return f.x * exp(-s / max(delta, 1e-6)); }
  }
  return f.x;
}

    out.normale = vec4f(koerper_normale(K, feld, lin, p), 1.0);
    out.info.z = f.b;
  }
  T = out;
}

<body>
<div id="app">
  <div id="stage">
    <canvas id="view" data-body="gas,rocky" aria-label="Planet view: drag to turn, scroll or pinch to zoom"></canvas>
    <canvas id="welt" data-body="welt" aria-label="Solar system: drag to turn, scroll or pinch to zoom, click selects, double-click flies there"></canvas>
    <div class="hud">
      <h1 id="t-title">Fluid Gas Planet</h1>
      <div id="planet-info" data-body="gas">Jupiter</div>
      <div class="meta" data-body="gas,rocky"><span id="fps">– fps</span> <span id="version"></span></div>
      <div class="meta" id="welt-status" data-body="welt">starte …</div>
      <div class="meta" id="hint" data-body="gas">drag to rotate, scroll or pinch to zoom</div>
      <div class="meta" data-body="rocky"><span id="mode-tag"></span> · <span id="t-hint"></span></div>
    </div>
    <div id="genbar" data-body="rocky" hidden><span id="gen-text"></span><div class="track"><div class="fill" id="gen-fill"></div></div></div>
    <div id="loading" data-body="gas" role="status" aria-live="polite">
      <div class="load-box">
        <p id="load-title">Spinning up the atmosphere</p>
        <div class="load-track"><span id="load-bar"></span></div>
        <p id="load-note"></p>
      </div>
    </div>
    <div id="toolbar"></div>
    <div id="status" hidden></div>
  </div>
  <aside id="panel">
    <div class="panel-head"><button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body"><span id="panel-title">Controls</span> <span aria-hidden="true">▴</span></button><nav id="ptype" class="seg"></nav><button id="lang" type="button">DE</button></div>
    <div id="panel-body"></div>
    <p class="credits" id="credits"></p>
  </aside>
</div>
<script>
  (function () {
    var aside = document.getElementById('panel');
    var btn = document.getElementById('panel-toggle');
    btn.addEventListener('click', function () {
      var open = aside.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('[aria-hidden]').textContent = open ? '▾' : '▴';
    });
  })();
</script>
